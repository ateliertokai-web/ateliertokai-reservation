<script>
(function(){var er=[];window.__er=er;

a.innerHTML='<div class="card err">読み込みに時間がかかっています。<br><small>状態: firebase='+(typeof firebase)+' / core='+(typeof makeCore)+(er.length?' / '+er.join(', '):'')+'</small><br><button class="s" style="margin-top:10px" onclick="location.reload()">もう一度読み込む</button></div>'}},15000)})();
</script>

<script>
(function(){
'use strict';
var PV=/[?&#]pv=1(&|$)/.test(location.search+location.hash);
if(PV){var pvb=document.createElement('div');pvb.id='pvbar';pvb.style.cssText='position:sticky;top:0;z-index:50;background:#c0392b;color:#fff;text-align:center;padding:12px 10px;line-height:1.4';pvb.innerHTML='<div style="text-align:left;margin:-4px 0 6px"><a href="admin.html" style="color:#fff;font-size:14px;font-weight:700;text-decoration:underline">← 管理画面へ戻る</a></div><div style="font-size:22px;font-weight:700;letter-spacing:.05em">確認画面中です</div><div style="font-size:13px;margin-top:2px">練習用の画面です。お客様には見えません。予約は保存されません。</div>';var pm=document.getElementById('app');pm.parentNode.insertBefore(pvb,pm)}
/* 管理画面の「保存前の設定でお客様画面を確認」から渡された、未保存の設定（練習モードのときだけ使う） */
function pvGet(){if(!PV)return null;try{var o=JSON.parse(localStorage.getItem('rv_preview')||'null');return o&&o.id&&Date.now()-o.at<12*3600e3?o:null}catch(e){return null}}
function realTest(ev){return !!(ev&&ev.savedTest)}
function pvApply(e){e.savedTest=!!e.test;var o=pvGet();if(!o||o.id!==e.id)return e;var r=Object.assign({},e,o.ev,{pvDraft:true,savedTest:!!e.test});if(o.imgs){r.thumb=o.thumb;r.imgN=o.imgN}return r}
if(PV&&pvGet()){var pvn=document.createElement('div');pvn.style.cssText='font-size:13px;margin-top:4px;font-weight:700';pvn.textContent='管理画面の「保存していない設定」で表示しています';document.getElementById('pvbar').appendChild(pvn)}
var app=document.getElementById('app'),C,S={ev:null,slots:[],slot:null,mode:'new',rec:null};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var q=function(id){return document.getElementById(id)};
var WD='日月火水木金土';
function day(s){var p=s.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);return (+p[1])+'月'+(+p[2])+'日（'+WD[d.getDay()]+'）'}
function rng(s){return s.start==='00:00'&&s.end==='24:00'?T('終日')+meetTxt():s.start+'〜'+s.end}
// 終日の枠：イベントに「集合・開始」「終了の目安」があれば、添える（例：終日（集合 9:00）)
function meetTxt(){var e=S.ev||{},a=e.meetAt||'',z=e.untilAt||'';if(!a&&!z)return '';return '（'+(a?T('集合')+' '+a.replace(/^0/,''):'')+(a&&z?'・':'')+(z?z.replace(/^0/,'')+' '+T('終了予定'):'')+'）'}
// 開催場所と、Googleマップを開くボタン
function placeName(e){var p=e&&e.place;return p==='kt'?T('レクサス鹿児島東開'):p==='sd'?T('CPO川内'):p==='ot'?(e.placeName||''):''}
function placeHTML(e){var n=placeName(e);if(!n)return '';var qy=(e.placeAddr||'').trim()||n;
  return '<p class="place">📍 '+esc(n)+' <a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(qy)+'" target="_blank" rel="noopener">'+T('Googleマップで開く')+'</a></p>'}
function fmtCode(id){return id.replace(/(.{4})(?=.)/g,'$1-')}
function dl(ev){return ev.deadlineMs?new Date(ev.deadlineMs).toLocaleString('ja-JP',{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'}):''}
function opts(a,b,sel){var o='';for(var i=a;i<=b;i++)o+='<option'+(i===sel?' selected':'')+'>'+i+'</option>';return o}
function busy(on,btn,txt){if(btn){btn.disabled=on;btn.classList.toggle('busy',!!on);if(txt)btn.textContent=txt}}
function top(){window.scrollTo(0,0)}
/* サーバーの時刻に合わせる（お客様のスマホの時計がずれていても、受付開始の判定がずれないように） */
var TOFF=0;
function nowS(){return Date.now()+TOFF}
function tmo(p,ms){return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'))},ms||12000)})])}
function syncTime(){
  return Promise.race([
    fetch(location.pathname,{method:'HEAD',cache:'no-store'}).then(function(r){var d=r.headers.get('Date');if(d){var t=new Date(d).getTime();if(t)TOFF=t-Date.now()}}).catch(function(){}),
    new Promise(function(res){setTimeout(res,2500)})
  ]);
}
function openText(ms){
  var d=new Date(ms),n=new Date(nowS()),p=function(x){return ('0'+x).slice(-2)},t=d.getHours()+':'+p(d.getMinutes());
  var same=d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate();
  return same?(T('本日')+' ')+t:(d.getMonth()+1)+'月'+d.getDate()+'日（'+WD[d.getDay()]+'） '+t;
}
/* 車種：全角英数を半角にする（大文字・小文字はそのまま） */
function fixModel(v){return v.replace(/[ａ-ｚＡ-Ｚ０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248)})}
/* この端末に予約番号を覚えておく（メールアドレスも一緒に保存。共用端末では「この端末から消す」で削除できます） */
var MYKEY='yoyaku_my_v1';
function myGet(){if(TXT.edit)return [{id:'ABCDEFGHJKLM',mail:'sample@example.com'}];try{var a=JSON.parse(localStorage.getItem(MYKEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function mySet(a){if(TXT.edit)return;try{localStorage.setItem(MYKEY,JSON.stringify(a.slice(0,20)))}catch(e){}}
// 確認画面（練習）で、準備中のイベントを予約したときは、通知のテスト用に、予約番号だけ覚える（「あなたの予約」には出さない）
var TESTK='rv_push_test_rids_v1';
function testGet(){try{var a=JSON.parse(localStorage.getItem(TESTK)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function testAdd(id){try{var a=testGet().filter(function(x){return x!==id});a.unshift(id);localStorage.setItem(TESTK,JSON.stringify(a.slice(0,10)))}catch(e){}}
function myAdd(id,mail){
  if(PV){if(S.ev&&realTest(S.ev)){testAdd(id);if(window.PUSH)PUSH.sync()}return}
  var a=myGet().filter(function(x){return x.id!==id});a.unshift({id:id,mail:mail});mySet(a);
  if(window.PUSH)PUSH.sync();   // 別の端末で予約を確認した・メールの控えのリンクから開いたときも、この端末の通知の宛先に加える
}
function myDel(id){mySet(myGet().filter(function(x){return x.id!==id}))}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){} // ブラウザに、保存した記録を消さないよう頼む

/* ---------- 予約の控え（コピー・自分宛メール・カレンダー）。ログインなしでも、予約を見失わないための補助 ---------- */
function myLink(rec){return location.origin+location.pathname+'#r='+rec.id+'&m='+encodeURIComponent(rec.mail)}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t);
  return new Promise(function(res,rej){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy')?res():rej()}catch(e){rej(e)}a.remove()});
}
function slotText(rec){return day(rec.date)+' '+rng(rec)}
// 来場受付のQR：管理画面で、イベントごとに、いつでもON／OFFを切り替えられる（初めはOFF。OFFのときは、何も出ない）
function qrHTML(ev,id){
  if(!(ev&&ev.checkin&&ev.checkinQr)||!id)return '';
  var img='';try{img='<img src="'+QR.dataURL(id,6)+'" alt="'+T('来場受付用のQRコード')+'" style="width:200px;height:200px;image-rendering:pixelated;display:block;margin:8px auto;border:1px solid #ddd;background:#fff">'}catch(e){return ''}
  return '<div class="box" style="margin-top:14px;text-align:center"><b style="font-size:14px">'+T('当日の受付用QRコード')+'</b>'+img+'<div class="code" style="font-size:15px">'+fmtCode(id)+'</div><p class="note" style="margin:6px 0 0">'+T('当日、受付で、この画面（またはスクリーンショット）をご提示ください。')+'</p></div>'}
function keepHTML(rec){var m=!!(rec&&rec.mail);return ('<div class="box" style="margin-top:14px"><b style="font-size:14px">'+T('ご予約番号を、なくさないために')+'</b><div class="tools" style="margin:8px 0 0"><button type="button" class="s" id="kc">'+T('予約番号をコピー')+'</button>')+(m?('<button type="button" class="s" id="km">'+T('自分宛にメールで控える')+'</button>'):'')+('<button type="button" class="s" id="kd">'+T('カレンダーに追加')+'</button></div>')+(m?('<p class="note" style="margin:8px 0 0">'+T('メールの控えには、予約を開くためのリンクが入ります。他の方には、送らないでください。')+'</p>'):'')+'</div>'}
function wireKeep(rec){
  var ev=rec.eventName||T('ご予約');
  q('kc').onclick=function(){var b=this;copyText(fmtCode(rec.id)).then(function(){b.textContent=T('コピーしました')}).catch(function(){b.textContent=T('コピーできませんでした')})};
  if(q('km'))q('km').onclick=function(){
    var box=q('mp');if(box){box.remove();return}
    var body=ev+'\n'+slotText(rec)+('\n'+T('予約番号：'))+fmtCode(rec.id)+('\n\n'+T('▼ご予約の確認・変更・キャンセル')+'\n')+myLink(rec)+('\n\n'+T('※ このリンクを開くと、ご予約の内容を確認できます。他の方には、送らないでください。'));
    var subj=T('【予約の控え】')+ev,to=rec.mail,E=encodeURIComponent;
    var mobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent),ios=/iPhone|iPad|iPod/i.test(navigator.userAgent);
    var qs=function(k){return k.map(function(p){return p[0]+'='+E(p[1])}).join('&')};
    var web=function(u){window.open(u,'_blank')};
    // アプリを開く方式は、入っていないと何も起きないので、少し待っても画面が残っていたら、ウェブ版を開く
    var tryApp=function(appUrl,webUrl){
      if(!mobile){web(webUrl);return}
      var t=setTimeout(function(){if(document.visibilityState==='visible')web(webUrl)},1500);
      document.addEventListener('visibilitychange',function f(){if(document.hidden){clearTimeout(t);document.removeEventListener('visibilitychange',f)}});
      location.href=appUrl;
    };
    var opts2=[
      [T('標準のメールアプリ'),function(){location.href='mailto:'+E(to)+'?'+qs([['subject',subj],['body',body]])}],
      ['Gmail',function(){
        var w='https://mail.google.com/mail/?view=cm&fs=1&'+qs([['to',to],['su',subj],['body',body]]);
        if(ios)tryApp('googlegmail:///co?'+qs([['to',to],['subject',subj],['body',body]]),w);else web(w)}],
      ['Outlook',function(){
        var w='https://outlook.live.com/mail/0/deeplink/compose?'+qs([['to',to],['subject',subj],['body',body]]);
        tryApp('ms-outlook://compose?'+qs([['to',to],['subject',subj],['body',body]]),w)}],
      [T('Yahoo!メール（本文をコピーして開く）'),function(){copyText(T('宛先：')+to+('\n'+T('件名：'))+subj+'\n\n'+body).catch(function(){});web('https://mail.yahoo.co.jp/');setTimeout(function(){alert(T('本文をコピーしました。Yahoo!メールで「新規作成」を開き、貼り付けて、ご自分宛に送ってください。'))},300)}],
      [T('本文をコピー'),function(){copyText(subj+'\n\n'+body).then(function(){alert(T('コピーしました。お使いのメールに貼り付けて、ご自分宛に送ってください。'))}).catch(function(){alert(T('コピーできませんでした。'))})}]
    ];
    box=document.createElement('div');box.id='mp';box.className='box';box.style.marginTop='10px';
    box.innerHTML=('<b style="font-size:14px">'+T('どのメールで控えますか？')+'</b><div class="tools" style="margin:8px 0 0"></div><p class="note" style="margin:8px 0 0">'+T('宛先は、お申し込みのメールアドレスです。送信するまで、メールは送られません。')+'</p>');
    opts2.forEach(function(o){var bt=document.createElement('button');bt.type='button';bt.className='s';bt.textContent=o[0];bt.onclick=function(){o[1].call(bt)};box.querySelector('.tools').appendChild(bt)});
    q('km').closest('.box').appendChild(box);
  };
  q('kd').onclick=function(){
    var p2=function(n){return ('0'+n).slice(-2)},ymd=rec.date.replace(/-/g,''),allday=rec.start==='00:00'&&rec.end==='24:00';
    var now=new Date(),stamp=now.getUTCFullYear()+p2(now.getUTCMonth()+1)+p2(now.getUTCDate())+'T'+p2(now.getUTCHours())+p2(now.getUTCMinutes())+p2(now.getUTCSeconds())+'Z';
    var dp=rec.date.split('-'),nx=new Date(+dp[0],+dp[1]-1,+dp[2]+1),ymd2=nx.getFullYear()+p2(nx.getMonth()+1)+p2(nx.getDate());
    var ice=function(s){return String(s).replace(/\\/g,'\\\\').replace(/[,;]/g,'\\$&').replace(/\r?\n/g,'\\n')};
    var when=allday?'DTSTART;VALUE=DATE:'+ymd+'\r\nDTEND;VALUE=DATE:'+ymd2:'DTSTART:'+ymd+'T'+rec.start.replace(':','')+'00\r\nDTEND:'+ymd+'T'+rec.end.replace(':','')+'00';
    var desc=T('予約番号：')+fmtCode(rec.id)+T('\\n確認・変更・キャンセル：')+myLink(rec);
    var ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Atelier Tokai//reservation//JA','BEGIN:VEVENT','UID:'+rec.id+'@atelier-tokai-reservation','DTSTAMP:'+stamp,when,'SUMMARY:'+ice(ev+T('（ご予約）')),'DESCRIPTION:'+desc,'END:VEVENT','END:VCALENDAR'].join('\r\n');
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar;charset=utf-8'}));a.download='reservation.ics';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},10000);
  };
}
function stBadge(r){
  var s=r.status;
  if(s==='confirmed')return ('<span class="st ok">'+T('予約確定')+'</span>');
  if(s==='won')return ('<span class="st ok">'+T('当選・予約確定')+'</span>');
  if(s==='lottery')return ('<span class="st lot">'+T('抽選結果待ち')+'</span>');
  if(s==='wait')return ('<span class="st wait">'+T('キャンセル待ち')+' ')+(r.waitNo||'')+(T('番目')+'</span>');
  if(s==='lost')return ('<span class="st ng">'+T('落選')+'</span>');
  return ('<span class="st ng">'+T('キャンセル済み')+'</span>');
}

/* ---------- イベント一覧 ---------- */
var homeIv=0;
async function home(){
  clearInterval(homeIv);
  top();
  app.innerHTML=('<div class="loading" role="status"><span class="spin"></span>'+T('読み込み中…')+'</div>');
  try{
    var snap=await tmo(PV?C.events.get():C.events.where('visible','==',true).get());
    var evs=snap.docs.map(function(d){return pvApply(Object.assign({id:d.id},d.data()))}).sort(function(a,b){return a.name<b.name?-1:1});
    var h=('<h2>'+T('ご予約・お申し込み')+'<small>'+T('ご希望のイベントを選んでください')+'</small></h2>');
    if(!evs.length)h+=('<div class="card note">'+T('現在、受付中のイベントはありません。')+'</div>');
    var soon=0;
    evs.forEach(function(e,i){
      var notYet=e.openAtMs&&nowS()<e.openAtMs;
      if(notYet&&(!soon||e.openAtMs<soon))soon=e.openAtMs;
      var closed=e.method==='抽選'&&(e.drawn||(e.deadlineMs&&nowS()>e.deadlineMs));
      var inner='<b>'+esc(e.name)+'</b>'+(PV&&e.visible===false&&!e.test?('<span class="tag w">'+T('受付終了')+'</span>'):'')+(e.pvDraft?('<span class="tag w">'+T('未保存の設定')+'</span>'):'')+(e.savedTest?('<span class="tag k">'+T('準備中・本当に保存')+'</span>'):'')+
        (e.method==='抽選'?('<span class="tag k">'+T('抽選')+'</span><span>')+(closed?T('受付は終了しました'):(T('締切')+' ')+dl(e))+'</span>':('<span class="tag">'+T('先着順')+'</span>'))+
        (notYet?('<div class="note" style="margin-top:6px;color:#8a6d2f"><b>'+T('ご予約は')+' ')+openText(e.openAtMs)+(' '+T('からです')+'</b><br><span class="cd" data-t="')+e.openAtMs+'"></span></div>':'');
      h+='<button class="ev" data-i="'+i+'"'+((closed||notYet)?' disabled style="opacity:.55"':'')+'>'+(e.thumb?'<div class="evr"><img class="evimg" src="'+esc(e.thumb)+'" alt=""><div>'+inner+'</div></div>':inner)+'</button>';
    });
    var mine=PV?[]:myGet();
    if(mine.length){
      h+=('<h2 style="margin-top:28px">'+T('あなたの予約')+'<small>'+T('この端末に保存されています')+'</small></h2><div id="my"><div class="loading sm" role="status"><span class="spin"></span>'+T('読み込み中…')+'</div></div>');
    }
    h+=('<div style="margin-top:28px;text-align:center"><button class="l" id="lk">'+T('ご予約の確認・変更・キャンセル')+'</button><div id="gd" style="margin-top:6px"></div></div>');
    app.innerHTML=h;
    app.querySelectorAll('.ev').forEach(function(b){b.onclick=function(){S.ev=evs[+b.dataset.i];pickSlot()}});
    q('lk').onclick=lookupView;
    app.insertAdjacentHTML('beforeend','<p class="note" style="text-align:center;margin:26px 0 0"><a href="privacy.html" target="_blank" rel="noopener">'+T('プライバシーポリシー')+'</a>　<a href="privacy.html#delete" target="_blank" rel="noopener">'+T('お客様情報の削除を依頼する')+'</a></p>');
    if(window.PUSH&&!TXT.edit){PUSH.inbox(app);if(!PV)PUSH.ask(app)}   // 届いたお知らせ／アプリとして使っている方に「通知を受け取りますか？」
    // 説明書（ご予約の方法）へのボタン。管理画面の「お客様画面」で表示ONのときだけ出す
    C.cfg.doc('guide').get().then(function(s){var g=s.exists?s.data():null,box=q('gd');
      if(box&&g&&g.on)box.innerHTML='<a class="l" href="guide.html">'+esc((g.label&&g.label.trim())||T('ご予約の方法（使い方）'))+'</a>'}).catch(function(){});
    if(mine.length)loadMine(mine);
    // 受付開始の時刻になったら、自動で画面を更新する
    if(soon){
      var tick=function(){
        if(!q('lk')){clearInterval(iv);return}
        var left=soon-nowS();
        if(left<=0){clearInterval(iv);home();return}
        app.querySelectorAll('.cd').forEach(function(s){
          var l=(+s.dataset.t)-nowS();
          if(l<=0){s.textContent='';return}
          if(l<=3600000){var m=Math.floor(l/60000),sec=Math.floor(l%60000/1000);s.textContent=(T('受付開始まで あと')+' ')+m+T('分')+('0'+sec).slice(-2)+T('秒')}else s.textContent='';
        });
      };
      var iv=homeIv=setInterval(tick,1000);tick();
    }

async function loadMine(mine){
  var box=q('my'),out='',rows=[];
  for(var i=0;i<mine.length;i++){
    try{var r=await C.lookup(mine[i].id,mine[i].mail);rows.push(r.ok?{id:mine[i].id,rec:r.r}:{id:mine[i].id,gone:true})}
    catch(e){rows.push({id:mine[i].id,err:true})}
  }
  if(!q('my'))return;
  rows.forEach(function(x,i){
    if(x.rec){var r=x.rec;
      out+='<div class="card"><div>'+stBadge(r)+'</div><p style="margin:8px 0 0"><b>'+esc(r.eventName)+'</b><br>'+day(r.date)+' '+rng(r)+'<br>'+esc(r.name)+(' '+T('様')+'　')+r.n+(T('名')+'<br><span class="note">'+T('予約番号')+' ')+fmtCode(x.id)+'</span></p>'+
       '<button class="s" data-o="'+i+('">'+T('開く（変更・キャンセル）')+'</button> <button class="s" data-d="')+i+('">'+T('この端末から消す')+'</button></div>');
    }else{
      out+=('<div class="card"><p class="note" style="margin:0">'+T('予約番号')+' ')+fmtCode(x.id)+(x.gone?('<br>'+T('予約が見つかりませんでした。')):('<br>'+T('読み込めませんでした。')))+'</p><button class="s" data-d="'+i+('">'+T('この端末から消す')+'</button></div>');
    }
  });
  box.innerHTML=out;

    var x=rows[+b.dataset.o];S.rec=Object.assign({id:x.id},x.rec);S.msg='';b.disabled=true;

async function submit(){
  var g=gather(),er=q('er'),btn=q('go'),gn=g.d.guestNos||[];delete g.d.guestNos;

    try{

      if(dups.length&&!confirm(T('同姓同名のご予約が既に入っています：')+dups.join('、')+(' '+T('様\n\nお名前に間違いがなければ、このままご予約いただけます。')+'\n')+(S.mode==='edit'?T('変更を保存しますか？'):T('予約しますか？')))){busy(false,btn,S.mode==='edit'?T('変更を保存する'):S.ev.method==='抽選'?T('抽選に申し込む'):T('予約する'));return}
    }catch(x){}
  }
  var unbusy=function(){busy(false,btn,S.mode==='edit'?T('変更を保存する'):S.ev.method==='抽選'?T('抽選に申し込む'):T('予約する'))};
  try{
    var r;
    if(S.mode==='edit'&&PV&&!realTest(S.ev)){S.msg='【練習モード】変更は保存していません';S.justChanged=true;return detailView()}
    if(S.mode==='edit'){
      var ns=q('ns')?q('ns').value:S.slot.id;
      if(ns!==S.slot.id){
        var tg=S.slots.filter(function(x){return x.id===ns})[0],nn=g.d.a+g.d.k+g.d.s+g.d.m;
        var fullT=tg&&((tg.capG&&(tg.booked||0)>=tg.capG)||(tg.capP&&(tg.people||0)+nn>tg.capP));
        if(fullT&&C.isFixed(S.rec.status)){

          if(!confirm(T('ご希望の時間帯は、現在満席です。\n\n変更をお進めいただくと「キャンセル待ち」となり、元のお時間のご予約は解放されます。空きが出なかった場合、ご参加いただけないこともございます。\n\nこのまま変更しますか？')))return unbusy();
        }
      }
      var patch=Object.assign({},g.d);delete patch.mail;
      r=await C.change(S.rec.id,S.rec.mail,patch,ns);
      if(r.ok){var l=await C.lookup(S.rec.id,S.rec.mail);S.rec=Object.assign({id:S.rec.id},l.r);S.justChanged=true;S.msg=r.waitlisted?T('ご希望の時間帯は満席のため、キャンセル待ち（')+r.waitNo+T('番目）として受け付けました。元のお時間のご予約は解放されています。空きが出た場合は、店舗からご連絡します。'):T('変更を保存しました');return detailView()}
    }else{
      if(PV&&!realTest(S.ev)){r={ok:true,id:'PRACTICE0000',status:'confirmed'};return doneView(r,g.d,gn)}
      r=await C.book(S.slot.id,g.d);
      if(r.ok){myAdd(r.id,g.d.mail);return doneView(r,g.d,gn)}
    }

  }catch(e){er.textContent=e.code==='permission-denied'?T('お申し込みを受け付けられませんでした。受付開始前、または受付が終了している可能性があります。画面を更新して、もう一度お試しください。'):T('通信に失敗しました。電波の良い場所で、もう一度お試しください。（')+(e.code||e.message||'')+'）'}
  unbusy();
}

  var url=isGrp?guestUrl(gid).replace('?g=','?k='):guestUrl(gid),txt=guestShareText(S.rec,url),E=encodeURIComponent,img='';
  try{img='<img src="'+QR.dataURL(url,6)+'" alt="QRコード" style="width:180px;height:180px;image-rendering:pixelated;display:block;margin:8px auto 4px;border:1px solid #ddd">'}catch(e){}
  pane.innerHTML=('<div class="tools" style="margin:10px 0 4px;flex-wrap:wrap"><button type="button" class="s" data-sh="line">'+T('LINEで送る')+'</button><button type="button" class="s" data-sh="mail">'+T('メールで送る')+'</button><button type="button" class="s" data-sh="copy">'+T('文章をコピー')+'</button></div>')+
    img+(img?('<p class="note" style="text-align:center;margin:0 0 6px">'+T('QRコードは、長押しで保存できます。その場で、お連れ様のスマホで読み取ってもらうこともできます。')+'</p>'):'')+
    '<p class="note" style="word-break:break-all;margin:4px 0 0">'+esc(url)+'</p>';
  pane.querySelector('[data-sh="line"]').onclick=function(){location.href='https://line.me/R/share?text='+E(txt)};
  pane.querySelector('[data-sh="mail"]').onclick=function(){location.href='mailto:?subject='+E(T('【ゴルフ参加者情報のご入力のお願い】')+S.rec.eventName)+'&body='+E(txt)};
  pane.querySelector('[data-sh="copy"]').onclick=function(){var t=this;copyText(txt).then(function(){t.textContent=T('コピーしました')}).catch(function(){t.textContent=T('コピーできませんでした')})};
}
async function loadGuests(){
  var box=q('gst');if(!box)return;
  var r=S.rec,inv=r.inv||{},rows=[],sync=false,ps=(r.participants||[]).slice(),notes=[],PRX=PV&&!realTest(S.ev);   // PRX：練習（何もサーバーに保存しない）
  for(var no=2;no<=r.n;no++){
    var g=null;
    if(inv[no]){try{g=(PRX&&PRAC.isId(inv[no]))?PRAC.get(inv[no]):await C.getGuest(inv[no])}catch(e){}}
    rows.push({no:no,g:g});
    if(!g)continue;
    var cur=ps[no-1]||'',want=null;
    if(!g.cx&&g.name&&cur!==g.name)want=g.name;
    else if(g.cx&&g.cxName&&cur===g.cxName)want='';
    if(want!==null){while(ps.length<no)ps.push('');ps[no-1]=want;sync=true}
    if(g.cx&&g.cxBy==='guest')notes.push(T('参加者')+no+T('の')+(g.cxName?esc(g.cxName)+(' '+T('様')):T('お連れ様'))+T('が、入力を取り消しました。'));
  }
  // お連れ様が入力したお名前を、予約の参加者名にも反映する
  if(sync){if(PRX)S.rec.participants=ps;else{try{await C.syncParticipants(r.id,ps);S.rec.participants=ps}catch(e){}}}
  var h=(PRX?'<p class="note" style="color:#c0392b;margin:6px 0"><b>【練習】</b>ここでの操作は、サーバーには保存されません。お連れ様の練習ページに入力した内容は、この端末のブラウザの中で、ここに反映されます（本番では、予約の参加者名にも反映され、管理画面・CSVにも出ます）。</p>':'')+
    ('<div style="text-align:right"><button type="button" class="l" id="gref">'+T('最新の状態に更新')+'</button></div>')+
    (notes.length?('<div class="box" style="border-color:#c0392b"><b>'+T('お知らせ')+'</b><br>')+notes.join('<br>')+('<br><small>'+T('人数を減らす場合は、下の「内容を変更する」から変更してください。')+'</small></div>'):'');
  var grpId='';rows.forEach(function(x){if(x.g&&x.g.grp&&!grpId)grpId=x.g.grp});
  if(grpId)h+='<div class="card" style="margin:8px 0;padding:10px 12px"><b>'+T('全員共通のURL')+'</b><div class="tools" style="margin:8px 0 0"><button type="button" class="s" id="gv">'+T('共通URL・QRを表示')+'</button></div><div data-gp="grp"></div></div>';
  h+=rows.map(function(x){
    var g=x.g,st,btn='';
    if(!g){st=('<span class="note">'+T('未入力')+'</span>');btn='<button type="button" class="s" data-ga="send" data-no="'+x.no+('">'+T('URLを送る')+'</button>')}
    else{
      if(g.cx)st=('<span class="note">'+T('取り消し（'))+(g.cxName?esc(g.cxName)+(' '+T('様・')):'')+(T('ご本人が取り消しました）')+'</span>');
      else if(g.name)st='<b>'+esc(g.name)+('</b> '+T('様')+' <span class="tag k">'+T('入力済み')+'</span>');
      else st=('<span class="note">'+T('未入力（URL送付済み）')+'</span>');
      btn='<button type="button" class="s" data-ga="send" data-no="'+x.no+('">'+T('URL・QRを表示')+'</button>')+
        (g.name&&!g.cx?'<button type="button" class="s" data-ga="ren" data-no="'+x.no+('">'+T('名前を直す')+'</button>'):'')+
        '<button type="button" class="s d" data-ga="del" data-no="'+x.no+('">'+T('取り消す')+'</button>');
    }
    return ('<div class="card" style="margin:8px 0;padding:10px 12px"><div>'+T('参加者'))+x.no+'：'+st+'</div><div class="tools" style="margin:8px 0 0;flex-wrap:wrap">'+btn+'</div><div data-gp="'+x.no+'"></div></div>';
  }).join('');
  box.innerHTML=h;
  // 「最新の状態に更新」。別のタブ・端末でお連れ様が入力したあと、この画面に戻ってきたときも、自動で更新する（URL・QRを開いているときは更新しない）
  var rf=q('gref');if(rf)rf.onclick=function(){loadGuests()};
  window.onfocus=function(){var bx=q('gst');if(bx&&!document.hidden&&!bx.querySelector('[data-gp]:not(:empty)'))loadGuests()};
  var byNo={};rows.forEach(function(x){byNo[x.no]=x.g});
  var gvb=q('gv');if(gvb)gvb.onclick=function(){guestSharePane(box.querySelector('[data-gp="grp"]'),grpId,true)};
  box.querySelectorAll('[data-ga]').forEach(function(b){b.onclick=async function(){
    var no=+b.dataset.no,a=b.dataset.ga,g=byNo[no],pane=box.querySelector('[data-gp="'+no+'"]');
    if(PRX){
      // 練習画面（準備中ではないイベント）：サーバーには何も保存せず、この端末のブラウザの中だけで、お連れ様の入力まで試せる
      try{
        if(a==='send'){
          var pg=(g&&PRAC.isId(g.id))?g.id:PRAC.newId();
          if(!g&&!PRAC.put(pg,{no:no,eid:S.rec.eventId,ev:S.rec.eventName||'',date:S.rec.date||'',start:S.rec.start||'',end:S.rec.end||'',host:S.rec.name||'',name:'',own:false,hasMail:false,cx:false,mail:''})){pane.innerHTML='<p class="err">この端末では、練習用の保存ができませんでした（プライベートブラウズなど）。</p>';return}
          S.rec.inv=Object.assign({},S.rec.inv||{});S.rec.inv[no]=pg;
          guestSharePane(pane,pg);
          pane.insertAdjacentHTML('afterbegin','<p class="note" style="color:#c0392b;margin:8px 0 0"><b>【練習用】</b>このURLは、この端末のブラウザの中だけで動きます。下のボタンで、お連れ様のページを開いて、入力を試してください。入力したら、このページに戻って「最新の状態に更新」を押します。</p><p style="margin:6px 0 0"><a class="s" href="'+esc(guestUrl(pg))+'" target="_blank" rel="noopener">お連れ様のページを開く（練習）</a></p>');
          if(!g)b.textContent=T('URL・QRを表示');
        }else if(a==='ren'){
          var nm0=prompt(T('参加者')+no+T('のお名前'),g.name||'');
          if(nm0&&nm0.trim()){PRAC.put(g.id,Object.assign({},PRAC.get(g.id),{name:nm0.trim().slice(0,50)}));await loadGuests()}
        }else if(a==='del'){
          if(!confirm(T('参加者')+no+(g.name||g.cxName?'（'+(g.name||g.cxName)+(' '+T('様）')):'')+T('の入力を取り消します。送ったURLは使えなくなります。よろしいですか？')))return;
          var nm1=g.name||g.cxName||'';
          PRAC.put(g.id,Object.assign({},PRAC.get(g.id),{name:'',own:false,hasMail:false,mail:'',cx:true,cxBy:'owner',cxName:nm1.slice(0,50)}));
          var inv3=Object.assign({},S.rec.inv||{});delete inv3[no];S.rec.inv=inv3;
          var ps3=(S.rec.participants||[]).slice();if(nm1&&ps3[no-1]===nm1){ps3[no-1]='';S.rec.participants=ps3}
          await loadGuests();
        }
      }catch(e){pane.innerHTML=('<p class="err">'+T('うまくいきませんでした。もう一度お試しください。')+'</p>')}
      return}
    b.disabled=true;
    try{
      if(a==='send'){
        var gid=await C.makeInvite(S.rec,no);S.rec.inv=Object.assign({},S.rec.inv||{});S.rec.inv[no]=gid;
        guestSharePane(pane,gid);if(!g)b.textContent=T('URL・QRを表示');
      }else if(a==='ren'){
        var nm=prompt(T('参加者')+no+T('のお名前'),g.name||'');
        if(nm&&nm.trim()){await C.renameGuest(g,nm);await loadGuests();return}
      }else if(a==='del'){
        if(!confirm(T('参加者')+no+(g.name||g.cxName?'（'+(g.name||g.cxName)+(' '+T('様）')):'')+T('の入力を取り消します。送ったURLは使えなくなります。よろしいですか？'))){b.disabled=false;return}
        var ps2=await C.cancelGuest(g,'owner',S.rec);
        var inv2=Object.assign({},S.rec.inv||{});delete inv2[no];S.rec.inv=inv2;if(ps2)S.rec.participants=ps2;
        await loadGuests();return;
      }
    }catch(e){pane.innerHTML=('<p class="err">'+T('うまくいきませんでした。もう一度お試しください。')+'</p>')}
    b.disabled=false;
  }});
}

/* ---------- メールの控えのリンクから開く（#r=予約番号&m=メール） ---------- */
async function openFromLink(){
  var m=/^#r=([A-Za-z0-9]{12})&m=(.*)$/.exec(location.hash||'');
  if(!m)return home();
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  try{
    var r=await C.lookup(m[1],decodeURIComponent(m[2]));
    if(r.ok){S.rec=Object.assign({id:r.id},r.r);myAdd(r.id,S.rec.mail);S.msg='';await loadForRec();return detailView()}
  }catch(e){}
  home();
}

/* ---------- 起動 ---------- */
var RV=window.RV;
if(TXT.edit&&window.EDITSAMPLE){
  /* 管理画面の「お客様画面の文言」用：見本のデータで、どの画面も開ける（保存はしない） */
  C=EDITSAMPLE();var ED=EDITDATA,E=ED.EV,SLS=ED.SL;
  function eset(ev,slot,rec,mode){S.ev=Object.assign({id:ev},E[ev]);S.slot=slot?Object.assign({id:slot},SLS[slot]):null;S.rec=rec||null;S.mode=mode||'new';S.msg=''}
  var SCR={
    home:function(){home()},
    pick:function(){eset('E1');pickSlot()},
    pickLot:function(){eset('E3');pickSlot()},
    form:function(){eset('E1','S1');formView()},
    formFull:function(){eset('E1','S2');formView()},
    formLot:function(){eset('E3','S4');formView()},
    formGolf:function(){eset('E2','S3');formView()},
    done:function(){eset('E1','S1');doneView({id:'ABCDEFGHJKLM',status:'confirmed'},{name:'鹿児島 太郎',a:2,k:0,s:0,m:0,mail:'sample@example.com'})},
    doneWait:function(){eset('E1','S2');doneView({id:'ABCDEFGHJKLM',status:'wait',waitNo:3},{name:'鹿児島 太郎',a:2,k:0,s:0,m:0,mail:'sample@example.com'})},
    doneLot:function(){eset('E3','S4');doneView({id:'ABCDEFGHJKLM',status:'lottery'},{name:'鹿児島 太郎',a:2,k:0,s:0,m:0,mail:'sample@example.com'})},
    lookup:function(){lookupView()},
    owner:function(){ownerFindView()},
    detail:function(){eset('E1','S1',ED.rec());detailView()},
    detailWait:function(){eset('E1','S2',ED.rec({status:'wait',waitNo:3,slotId:'S2',start:'11:00',end:'12:00'}));detailView()},
    detailLot:function(){eset('E3','S4',ED.rec({eventId:'E3',eventName:E.E3.name,slotId:'S4',date:SLS.S4.date,start:'10:00',end:'12:00',status:'lottery'}));detailView()},
    detailLost:function(){eset('E3','S4',ED.rec({eventId:'E3',eventName:E.E3.name,slotId:'S4',date:SLS.S4.date,start:'10:00',end:'12:00',status:'lost'}));detailView()},
    detailCancel:function(){eset('E1','S1',ED.rec({status:'cancel'}));detailView()},
    doneGuest:function(){eset('E2','S3');doneView({id:'ABCDEFGHJKLM',status:'confirmed'},{name:'鹿児島 太郎',a:3,k:0,s:0,m:0,mail:'sample@example.com',participants:['鹿児島 太郎','','']},[2,3])},
    detailGolf:function(){eset('E2','S3',ED.rec({eventId:'E2',eventName:E.E2.name,slotId:'S3',date:SLS.S3.date,start:'00:00',end:'24:00',n:3,a:3,participants:['鹿児島 太郎','山田 花子','知覧 大輔'],inv:{'2':'GGGGGGGGGGGG'}}));loadForRec=async function(){};detailView()},
    edit:function(){eset('E1','S1',ED.rec(),'edit');formView()}
  };
  window.addEventListener('message',function(e){if(e.origin!==location.origin||!e.data||e.data.type!=='tx-go')return;var f=SCR[e.data.screen];if(f){document.querySelectorAll('.txp').forEach(function(p){p.remove()});f()}});
  TXT.screens=Object.keys(SCR);
  home();
}else if(typeof firebase==='undefined'||typeof makeCore==='undefined'){
  app.innerHTML='<div class="card err">必要なファイルを読み込めませんでした。電波の良い場所で、もう一度お試しください。<br><button class="s" style="margin-top:10px" onclick="location.reload()">もう一度読み込む</button></div>';
}else if(!window.FIREBASE_CONFIG||/ここに/.test(FIREBASE_CONFIG.apiKey)){
  app.innerHTML='<div class="card err">Firebaseの設定が未入力です（firebase-config.js）。</div>';
}else{
  firebase.initializeApp(FIREBASE_CONFIG);
  var FDB=firebase.firestore();try{FDB.settings({experimentalAutoDetectLongPolling:true,merge:true})}catch(e){}
  C=makeCore(firebase,FDB);
  if(window.PUSH&&!TXT.edit)PUSH.watch(function(){return q('lk')?app:null});
  if(window.PUSH)PUSH.init(FDB,function(){return myGet().map(function(x){return x.id}).concat(testGet())});
  var GM=/[?&]g=([A-HJ-NP-Z2-9]{12})(&|$)/.exec(location.search);
  if(GM){location.replace(location.pathname.replace(/[^/]*$/,'')+'guest.html'+location.search)}
  else syncTime().then(function(){return Promise.race([TXT.load(FDB),new Promise(function(r){setTimeout(r,1500)})])}).then(openFromLink);
}
})();
