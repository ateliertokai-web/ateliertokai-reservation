<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier Tokai reservation</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="予約">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><h1>Atelier Tokai reservation</h1></header>
<main id="app"><p class="note" style="text-align:center;padding:40px 0">読み込み中…</p></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="core.js"></script>
<script>
(function(){
'use strict';
var app=document.getElementById('app'),C,S={ev:null,slots:[],slot:null,mode:'new',rec:null};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var q=function(id){return document.getElementById(id)};
var WD='日月火水木金土';
function day(s){var p=s.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);return (+p[1])+'月'+(+p[2])+'日（'+WD[d.getDay()]+'）'}
function rng(s){return s.start==='00:00'&&s.end==='24:00'?'終日':s.start+'〜'+s.end}
function fmtCode(id){return id.replace(/(.{4})(?=.)/g,'$1-')}
function dl(ev){return ev.deadlineMs?new Date(ev.deadlineMs).toLocaleString('ja-JP',{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'}):''}
function opts(a,b,sel){var o='';for(var i=a;i<=b;i++)o+='<option'+(i===sel?' selected':'')+'>'+i+'</option>';return o}
function busy(on,btn,txt){if(btn){btn.disabled=on;if(txt)btn.textContent=txt}}
function top(){window.scrollTo(0,0)}
/* サーバーの時刻に合わせる（お客様のスマホの時計がずれていても、受付開始の判定がずれないように） */
var TOFF=0;
function nowS(){return Date.now()+TOFF}
function syncTime(){
  return Promise.race([
    fetch(location.pathname,{method:'HEAD',cache:'no-store'}).then(function(r){var d=r.headers.get('Date');if(d){var t=new Date(d).getTime();if(t)TOFF=t-Date.now()}}).catch(function(){}),
    new Promise(function(res){setTimeout(res,2500)})
  ]);
}
function openText(ms){
  var d=new Date(ms),n=new Date(nowS()),p=function(x){return ('0'+x).slice(-2)},t=d.getHours()+':'+p(d.getMinutes());
  var same=d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate();
  return same?'本日 '+t:(d.getMonth()+1)+'月'+d.getDate()+'日（'+WD[d.getDay()]+'） '+t;
}
/* 車種：全角英数を半角にする（大文字・小文字はそのまま） */
function fixModel(v){return v.replace(/[ａ-ｚＡ-Ｚ０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248)})}
/* この端末に予約番号を覚えておく（メールアドレスも一緒に保存。共用端末では「この端末から消す」で削除できます） */
var MYKEY='yoyaku_my_v1';
function myGet(){try{var a=JSON.parse(localStorage.getItem(MYKEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function mySet(a){try{localStorage.setItem(MYKEY,JSON.stringify(a.slice(0,20)))}catch(e){}}
function myAdd(id,mail){var a=myGet().filter(function(x){return x.id!==id});a.unshift({id:id,mail:mail});mySet(a)}
function myDel(id){mySet(myGet().filter(function(x){return x.id!==id}))}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){} // ブラウザに、保存した記録を消さないよう頼む

/* ---------- 予約の控え（コピー・自分宛メール・カレンダー）。ログインなしでも、予約を見失わないための補助 ---------- */
function myLink(rec){return location.origin+location.pathname+'#r='+rec.id+'&m='+encodeURIComponent(rec.mail)}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t);
  return new Promise(function(res,rej){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy')?res():rej()}catch(e){rej(e)}a.remove()});
}
function slotText(rec){return day(rec.date)+' '+rng(rec)}
function keepHTML(){return '<div class="box" style="margin-top:14px"><b style="font-size:14px">ご予約番号を、なくさないために</b><div class="tools" style="margin:8px 0 0"><button type="button" class="s" id="kc">予約番号をコピー</button><button type="button" class="s" id="km">自分宛にメールで控える</button><button type="button" class="s" id="kd">カレンダーに追加</button></div><p class="note" style="margin:8px 0 0">メールの控えには、予約を開くためのリンクが入ります。他の方には、送らないでください。</p></div>'}
function wireKeep(rec){
  var ev=rec.eventName||'ご予約';
  q('kc').onclick=function(){var b=this;copyText(fmtCode(rec.id)).then(function(){b.textContent='コピーしました'}).catch(function(){b.textContent='コピーできませんでした'})};
  q('km').onclick=function(){
    var box=q('mp');if(box){box.remove();return}
    var body=ev+'\n'+slotText(rec)+'\n予約番号：'+fmtCode(rec.id)+'\n\n▼ご予約の確認・変更・キャンセル\n'+myLink(rec)+'\n\n※ このリンクを開くと、ご予約の内容を確認できます。他の方には、送らないでください。';
    var subj='【予約の控え】'+ev,to=rec.mail,E=encodeURIComponent;
    var mobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent),ios=/iPhone|iPad|iPod/i.test(navigator.userAgent);
    var qs=function(k){return k.map(function(p){return p[0]+'='+E(p[1])}).join('&')};
    var web=function(u){window.open(u,'_blank')};
    // アプリを開く方式は、入っていないと何も起きないので、少し待っても画面が残っていたら、ウェブ版を開く
    var tryApp=function(appUrl,webUrl){
      if(!mobile){web(webUrl);return}
      var t=setTimeout(function(){if(document.visibilityState==='visible')web(webUrl)},1500);
      document.addEventListener('visibilitychange',function f(){if(document.hidden){clearTimeout(t);document.removeEventListener('visibilitychange',f)}});
      location.href=appUrl;
    };
    var opts2=[
      ['標準のメールアプリ',function(){location.href='mailto:'+E(to)+'?'+qs([['subject',subj],['body',body]])}],
      ['Gmail',function(){
        var w='https://mail.google.com/mail/?view=cm&fs=1&'+qs([['to',to],['su',subj],['body',body]]);
        if(ios)tryApp('googlegmail:///co?'+qs([['to',to],['subject',subj],['body',body]]),w);else web(w)}],
      ['Outlook',function(){
        var w='https://outlook.live.com/mail/0/deeplink/compose?'+qs([['to',to],['subject',subj],['body',body]]);
        tryApp('ms-outlook://compose?'+qs([['to',to],['subject',subj],['body',body]]),w)}],
      ['Yahoo!メール（本文をコピーして開く）',function(){copyText('宛先：'+to+'\n件名：'+subj+'\n\n'+body).catch(function(){});web('https://mail.yahoo.co.jp/');setTimeout(function(){alert('本文をコピーしました。Yahoo!メールで「新規作成」を開き、貼り付けて、ご自分宛に送ってください。')},300)}],
      ['本文をコピー',function(){var self=this;copyText(subj+'\n\n'+body).then(function(){alert('コピーしました。お使いのメールに貼り付けて、ご自分宛に送ってください。')}).catch(function(){alert('コピーできませんでした。')})}]
    ];
    box=document.createElement('div');box.id='mp';box.className='box';box.style.marginTop='10px';
    box.innerHTML='<b style="font-size:14px">どのメールで控えますか？</b><div class="tools" style="margin:8px 0 0"></div><p class="note" style="margin:8px 0 0">宛先は、お申し込みのメールアドレスです。送信するまで、メールは送られません。</p>';
    opts2.forEach(function(o){var bt=document.createElement('button');bt.type='button';bt.className='s';bt.textContent=o[0];bt.onclick=function(){o[1].call(bt)};box.querySelector('.tools').appendChild(bt)});
    q('km').closest('.box').appendChild(box);
  };
  q('kd').onclick=function(){
    var p2=function(n){return ('0'+n).slice(-2)},ymd=rec.date.replace(/-/g,''),allday=rec.start==='00:00'&&rec.end==='24:00';
    var now=new Date(),stamp=now.getUTCFullYear()+p2(now.getUTCMonth()+1)+p2(now.getUTCDate())+'T'+p2(now.getUTCHours())+p2(now.getUTCMinutes())+p2(now.getUTCSeconds())+'Z';
    var when=allday?'DTSTART;VALUE=DATE:'+ymd+'\r\nDTEND;VALUE=DATE:'+ymd:'DTSTART:'+ymd+'T'+rec.start.replace(':','')+'00\r\nDTEND:'+ymd+'T'+rec.end.replace(':','')+'00';
    var desc='予約番号：'+fmtCode(rec.id)+'\\n確認・変更・キャンセル：'+myLink(rec);
    var ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Atelier Tokai//reservation//JA','BEGIN:VEVENT','UID:'+rec.id+'@atelier-tokai-reservation','DTSTAMP:'+stamp,when,'SUMMARY:'+ev.replace(/[,;]/g,' ')+'（ご予約）','DESCRIPTION:'+desc,'END:VEVENT','END:VCALENDAR'].join('\r\n');
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar;charset=utf-8'}));a.download='reservation.ics';document.body.appendChild(a);a.click();a.remove();
  };
}
function stBadge(r){
  var s=r.status;
  if(s==='confirmed')return '<span class="st ok">予約確定</span>';
  if(s==='won')return '<span class="st ok">当選・予約確定</span>';
  if(s==='lottery')return '<span class="st lot">抽選結果待ち</span>';
  if(s==='wait')return '<span class="st wait">キャンセル待ち '+(r.waitNo||'')+'番目</span>';
  if(s==='lost')return '<span class="st ng">落選</span>';
  return '<span class="st ng">キャンセル済み</span>';
}

/* ---------- イベント一覧 ---------- */
async function home(){
  top();
  app.innerHTML='<p class="note" style="text-align:center;padding:40px 0">読み込み中…</p>';
  try{
    var snap=await C.events.where('visible','==',true).get();
    var evs=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())}).sort(function(a,b){return a.name<b.name?-1:1});
    var h='<h2>ご予約・お申し込み<small>ご希望のイベントを選んでください</small></h2>';
    if(!evs.length)h+='<div class="card note">現在、受付中のイベントはありません。</div>';
    var soon=0;
    evs.forEach(function(e,i){
      var notYet=e.openAtMs&&nowS()<e.openAtMs;
      if(notYet&&(!soon||e.openAtMs<soon))soon=e.openAtMs;
      var closed=e.method==='抽選'&&(e.drawn||(e.deadlineMs&&nowS()>e.deadlineMs));
      var inner='<b>'+esc(e.name)+'</b>'+
        (e.method==='抽選'?'<span class="tag k">抽選</span><span>'+(closed?'受付は終了しました':'締切 '+dl(e))+'</span>':'<span class="tag">先着順</span>')+
        (notYet?'<div class="note" style="margin-top:6px;color:#8a6d2f"><b>ご予約は '+openText(e.openAtMs)+' からです</b><br><span class="cd" data-t="'+e.openAtMs+'"></span></div>':'');
      h+='<button class="ev" data-i="'+i+'"'+((closed||notYet)?' disabled style="opacity:.55"':'')+'>'+(e.thumb?'<div class="evr"><img class="evimg" src="'+e.thumb+'" alt=""><div>'+inner+'</div></div>':inner)+'</button>';
    });
    var mine=myGet();
    if(mine.length){
      h+='<h2 style="margin-top:28px">あなたの予約<small>この端末に保存されています</small></h2><div id="my"><p class="note">読み込み中…</p></div>';
    }
    h+='<div style="margin-top:28px;text-align:center"><button class="l" id="lk">ご予約の確認・変更・キャンセル</button></div>';
    app.innerHTML=h;
    app.querySelectorAll('.ev').forEach(function(b){b.onclick=function(){S.ev=evs[+b.dataset.i];pickSlot()}});
    q('lk').onclick=lookupView;
    if(mine.length)loadMine(mine);
    // 受付開始の時刻になったら、自動で画面を更新する
    if(soon){
      var tick=function(){
        if(!q('lk')){clearInterval(iv);return}
        var left=soon-nowS();
        if(left<=0){clearInterval(iv);home();return}
        app.querySelectorAll('.cd').forEach(function(s){
          var l=(+s.dataset.t)-nowS();
          if(l<=0){s.textContent='';return}
          if(l<=3600000){var m=Math.floor(l/60000),sec=Math.floor(l%60000/1000);s.textContent='受付開始まで あと '+m+'分'+('0'+sec).slice(-2)+'秒'}else s.textContent='';
        });
      };
      var iv=setInterval(tick,1000);tick();
    }
  }catch(e){app.innerHTML='<div class="card err">読み込めませんでした。電波の良い場所で、もう一度お試しください。</div>'}
}

async function loadMine(mine){
  var box=q('my'),out='',rows=[];
  for(var i=0;i<mine.length;i++){
    try{var r=await C.lookup(mine[i].id,mine[i].mail);rows.push(r.ok?{id:mine[i].id,rec:r.r}:{id:mine[i].id,gone:true})}
    catch(e){rows.push({id:mine[i].id,err:true})}
  }
  if(!q('my'))return;
  rows.forEach(function(x,i){
    if(x.rec){var r=x.rec;
      out+='<div class="card"><div>'+stBadge(r)+'</div><p style="margin:8px 0 0"><b>'+esc(r.eventName)+'</b><br>'+day(r.date)+' '+rng(r)+'<br>'+esc(r.name)+' 様　'+r.n+'名<br><span class="note">予約番号 '+fmtCode(x.id)+'</span></p>'+
       '<button class="s" data-o="'+i+'">開く（変更・キャンセル）</button> <button class="s" data-d="'+i+'">この端末から消す</button></div>';
    }else{
      out+='<div class="card"><p class="note" style="margin:0">予約番号 '+fmtCode(x.id)+(x.gone?'<br>予約が見つかりませんでした。':'<br>読み込めませんでした。')+'</p><button class="s" data-d="'+i+'">この端末から消す</button></div>';
    }
  });
  box.innerHTML=out;
  box.querySelectorAll('[data-o]').forEach(function(b){b.onclick=async function(){
    var x=rows[+b.dataset.o];S.rec=Object.assign({id:x.id},x.rec);S.msg='';b.disabled=true;
    try{await loadForRec();detailView()}catch(e){b.disabled=false;alert('通信に失敗しました。もう一度お試しください。')}}});
  box.querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){
    if(!confirm('この端末の表示から消します（予約自体はキャンセルされません）。よろしいですか？'))return;
    myDel(rows[+b.dataset.d].id);home()}});
}

/* ---------- 日時の選択 ---------- */
async function pickSlot(){
  if(S.ev&&S.ev.openAtMs&&nowS()<S.ev.openAtMs){home();return}
  top();
  app.innerHTML='<p class="note" style="text-align:center;padding:40px 0">読み込み中…</p>';
  try{
    var snap=await C.slots.where('eventId','==',S.ev.id).get();
    S.slots=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())}).sort(function(a,b){return (a.date+a.start)<(b.date+b.start)?-1:1});
  }catch(e){app.innerHTML='<div class="card err">読み込めませんでした。</div>';return}
  var ev=S.ev,h='<button class="l" id="bk">← イベント一覧へ</button><h2>'+esc(ev.name)+'<small>'+(ev.method==='抽選'?'抽選のお申し込みです（締切 '+dl(ev)+'）':'先着順のお申し込みです')+'</small></h2>';
  if(ev.msg)h+='<div class="box">'+esc(ev.msg).replace(/\n/g,'<br>')+'</div>';
  if(ev.imgN>0){h+=(ev.thumb?'<img class="gthumb" id="gt" src="'+ev.thumb+'" alt="">':'')+'<div id="gal"><button class="s" id="gb">写真・パンフレットを見る（'+ev.imgN+'枚）</button></div>'}
  var cur='';
  if(!S.slots.length)h+='<div class="card note">現在、選べる日時がありません。</div>';
  S.slots.forEach(function(s,i){
    if(s.date!==cur){cur=s.date;h+='<h2 style="font-size:16px">'+day(s.date)+'</h2>'}
    var full=!ev.method||ev.method==='先着'?((s.capG&&(s.booked||0)>=s.capG)||(s.capP&&(s.people||0)>=s.capP)):false;ev.method==='抽選'?'<em>抽選受付中</em>':full?(ev.wait?'<em class="f">満席・キャンセル待ち</em>':'<em class="f">満席</em>'):(s.capG?'<em>残り '+Math.max(0,s.capG-(s.booked||0))+'組</em>':s.capP?'<em>残り '+Math.max(0,s.capP-(s.people||0))+'名</em>':'<em>受付中</em>');
    h+='<button class="slot" data-i="'+i+'"'+(full&&!ev.wait?' disabled':'')+'><b>'+rng(s)+'</b>'+lab+'</button>';
  });
  app.innerHTML=h;
  q('bk').onclick=home;
  if(q('gb')){
    var openGal=async function(){
      var box=q('gal');box.innerHTML='<p class="note">読み込み中…</p>';
      try{var d=await C.eimgs.doc(ev.id).get(),im=d.exists?d.data().imgs:[];
        box.innerHTML='<div class="gal">'+im.map(function(u){return '<img src="'+u+'" alt="">'}).join('')+'</div><button class="s" id="gc">写真を閉じる</button>';
        q('gc').onclick=function(){box.innerHTML='<button class="s" id="gb">写真・パンフレットを見る（'+ev.imgN+'枚）</button>';q('gb').onclick=openGal};
      }catch(e){box.innerHTML='<p class="err">読み込めませんでした。</p>'}
    };
    q('gb').onclick=openGal;if(q('gt'))q('gt').onclick=openGal;
  }
  app.querySelectorAll('.slot').forEach(function(b){b.onclick=function(){S.slot=S.slots[+b.dataset.i];S.mode='new';S.rec=null;formView()}});
}

/* ---------- 申込フォーム（新規・変更の共通） ---------- */
function formView(){
  top();
  var ev=S.ev,s=S.slot,r=S.rec||{},edit=S.mode==='edit',car=r.car||{},max=s.maxPer;
  var stores=r.stores||[];
  var h=(edit?'<button class="l" id="bk">← 戻る</button>':'<button class="l" id="bk">← 日時を選び直す</button>')+
   '<h2>'+esc(ev.name)+'<small>'+day(s.date)+' '+rng(s)+'</small></h2>';
  if(ev.msg)h+='<div class="box">'+esc(ev.msg).replace(/\n/g,'<br>')+'</div>';
  if(!edit&&ev.method==='抽選')h+='<p class="box">抽選のお申し込みです。'+dl(ev)+'に締め切ります。結果は「ご予約の確認・変更」で、予約番号とメールアドレスを入力してご確認ください。</p>';
  if(!edit&&ev.method!=='抽選'&&((s.capG&&(s.booked||0)>=s.capG)||(s.capP&&(s.people||0)>=s.capP)))h+='<p class="box">この枠は満席です。キャンセル待ちとして受け付けます。空きが出た場合は、店舗からご連絡します。</p>';
  if(edit&&S.slots.length>1){
    h+='<label>時間帯を変更する<select id="ns">'+S.slots.map(function(x){return '<option value="'+x.id+'"'+(x.id===s.id?' selected':'')+'>'+day(x.date)+' '+rng(x)+'</option>'}).join('')+'</select></label>';
  }
  h+='<form id="f" autocomplete="on">'+
   '<label>代表申込者（個人名）<input id="rn" required maxlength="50" autocomplete="name" value="'+esc(r.name)+'"></label>'+
   '<label>法人名（法人の場合のみ）<input id="rc" maxlength="50" value="'+esc(r.corp)+'"></label>'+
   '<label>連絡先（電話番号）<input id="rt" type="tel" required autocomplete="tel" value="'+esc(r.tel)+'"></label>'+
   '<label>メールアドレス<input id="rm" type="email" required autocomplete="email" value="'+esc(r.mail)+'"'+(edit?' disabled':'')+'></label>'+
   '<label>オーナーズカードID（お持ちの方）<input id="oc" maxlength="30" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="latin" placeholder="お持ちでなければ、空欄で結構です" value="'+esc(r.owner)+'"></label>'+
   '<h2 style="font-size:16px">来場人数</h2><div class="g"><label>合計（1〜'+max+'名）<select id="tt"></select></label><label>うち大人<select id="ad"></select></label></div>'+
   '<div class="note" id="kd"></div><div id="bd" class="g3" hidden></div><div class="note" id="bh"></div>'+
   (ev.lap?'<p class="box">'+esc(ev.lapText||RV.LAP_TEXT)+'</p>':'')+
   ((ev.names||ev.golf)?'<h2 style="font-size:16px">参加者のお名前</h2><div id="pn"></div>':'')+
   (ev.order?'<label class="chk"><input type="checkbox" id="od"'+(r.order?' checked':'')+'>現在お車注文中でレクサス車未所有の方はチェックをお願い致します。</label>':'')+
   '<fieldset id="car"><legend>保有レクサス車登録ナンバー</legend><div class="plate">'+
   '<label>地名<input id="pf" maxlength="6" autocomplete="off" placeholder="鹿児島" value="'+esc(car.pref)+'"></label>'+
   '<label>分類番号<input id="cl" inputmode="numeric" maxlength="3" autocomplete="off" placeholder="300" value="'+esc(car.cls)+'"></label>'+
   '<label>ひらがな<input id="kn" maxlength="1" autocomplete="off" placeholder="あ" value="'+esc(car.kana)+'"></label>'+
   '<label>番号<input id="nm" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="1234" value="'+esc(car.num)+'"></label></div>'+
   '<label>車種<input id="md" maxlength="30" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="latin" placeholder="例：NX350h" value="'+esc(car.model)+'"></label></fieldset>'+
   '<fieldset><legend>ご利用店舗（両方可）</legend>'+Object.keys(RV.STORES).map(function(k,i){
      var on=stores.indexOf(k)>=0;
      return '<label class="chk"><input type="checkbox" class="st" data-k="'+esc(k)+'"'+(on?' checked':'')+'>'+esc(k)+'</label>'+
        '<label class="stf" data-k="'+esc(k)+'"'+(on?'':' hidden')+'>担当スタッフ（'+esc(k)+'）<select data-k="'+esc(k)+'"><option value="">選択してください</option>'+RV.STORES[k].map(function(n){return '<option'+(((r.staff||{})[k]===n)?' selected':'')+'>'+esc(n)+'</option>'}).join('')+'</select></label>';
    }).join('')+'</fieldset>'+
   (ev.note?'<label>備考（ご要望・ご連絡事項など）<textarea id="nt" rows="3" maxlength="500">'+esc(r.note)+'</textarea></label>':'')+
   '<div class="err" id="er"></div><button class="p" id="go" type="submit">'+(edit?'変更を保存する':ev.method==='抽選'?'抽選に申し込む':'予約する')+'</button>'+
   (edit?'<div style="text-align:center;margin-top:18px"><button type="button" class="s d" id="cx">この予約をキャンセルする</button></div>':'')+'</form>';
  app.innerHTML=h;
  q('bk').onclick=edit?function(){detailView()}:pickSlot;
  var tt=q('tt'),ad=q('ad'),bd=q('bd'),kids=0,p1t=!!(edit&&(r.participants||[])[0]);
  var T0=edit?Math.min(max,Math.max(1,(+r.a||0)+(+r.k||0)+(+r.s||0)+(+r.m||0))):1;
  tt.innerHTML=opts(1,max,T0);
  var A0=edit?(+r.a||1):1;
  function fillAd(keep){var T=+tt.value;ad.innerHTML=ev.golf?opts(T,T,T):opts(1,T,Math.min(keep,T))}
  fillAd(A0);
  if(ev.golf)ad.parentNode.style.display='none'; // ゴルフ: お子様の選択なし（全員大人）
  function bsum(){return ['bk_','bs_','bm_'].reduce(function(n,i){return n+(q(i)?+q(i).value:0)},0)}
  function hint(){var h=q('bh');if(!kids){h.textContent='';return}h.textContent='お子様の内訳の合計：'+bsum()+' / '+kids+'名';h.style.color=bsum()===kids?'':'#b42318'}
  function upd(){
    var T=+tt.value,A=+ad.value;kids=T-A;
    q('kd').textContent=kids?'うちお子様 '+kids+'名':'';
    var pv={bk_:edit?+r.k||0:0,bs_:edit?+r.s||0:0,bm_:edit?+r.m||0:0};
    if(q('bk_')){pv={bk_:+q('bk_').value,bs_:+q('bs_').value,bm_:+q('bm_').value}}
    bd.hidden=!kids;
    bd.innerHTML=kids?[['bk_','未就学児'],['bs_','小学生'],['bm_','中学生以上']].map(function(x){return '<label>'+x[1]+'<select id="'+x[0]+'">'+opts(0,kids,Math.min(kids,pv[x[0]]))+'</select></label>'}).join(''):'';
    if(kids)['bk_','bs_','bm_'].forEach(function(i){q(i).onchange=hint});
    hint();
    if(q('pn')){
      var cur=[].map.call(q('pn').querySelectorAll('input'),function(i){return i.value});
      if(!cur.length&&edit)cur=(r.participants||[]).slice();
      var h='';for(var i=0;i<T;i++)h+='<label style="margin:6px 0">参加者'+(i+1)+'<input maxlength="40" value="'+esc(cur[i]!==undefined?cur[i]:(i===0?q('rn').value:''))+'"></label>';
      q('pn').innerHTML=h;
      var f1=q('pn').querySelector('input');if(f1)f1.oninput=function(){p1t=true};
    }
  }
  tt.onchange=function(){fillAd(+ad.value);upd()};ad.onchange=upd;
  upd();
  if(edit&&kids){q('bk_').value=Math.min(kids,+r.k||0);q('bs_').value=Math.min(kids,+r.s||0);q('bm_').value=Math.min(kids,+r.m||0);hint()}
  if(q('od')){var od=q('od');var tg=function(){q('car').disabled=od.checked};od.onchange=tg;tg()}
  /* ナンバー入力の補助 */
  var half=function(s){return s.replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248)})};
  // 入力中（変換中）は触らない。変換が確定したとき・入力欄を離れたときに整える（変換候補が壊れるのを防ぐ）
  var bindFix=function(el,fn,after){var run=function(){var v=fn(el.value);if(v!==el.value)el.value=v;if(after)after(el.value)};el.addEventListener('input',function(e){if(e.isComposing)return;run()});el.addEventListener('compositionend',run);el.addEventListener('blur',function(){run()})};
  bindFix(q('cl'),function(v){return half(v).replace(/\D/g,'').slice(0,3)},function(v){if(v.length===3&&document.activeElement===q('cl'))q('kn').focus()});
  bindFix(q('nm'),function(v){return half(v).replace(/\D/g,'').slice(0,4)});
  bindFix(q('kn'),function(v){return v.replace(/[ァ-ヶ]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-96)}).replace(/[^ぁ-ん]/g,'').slice(0,1)},function(v){if(v&&document.activeElement===q('kn'))q('nm').focus()});
  bindFix(q('md'),fixModel);
  // 地名は、変換を確定したら次の欄（分類番号）へ移る
  q('pf').addEventListener('compositionend',function(){var el=this;setTimeout(function(){if(el.value.trim()&&document.activeElement===el)q('cl').focus()},0)});
  app.querySelectorAll('.st').forEach(function(c){c.onchange=function(){app.querySelector('.stf[data-k="'+c.dataset.k+'"]').hidden=!c.checked}});
  // 参加者1には、代表申込者を自動で入れる（参加者1を直接変更したあとは、そのまま）
  q('rn').addEventListener('input',function(){var f=q('pn')&&q('pn').querySelector('input');if(f&&!p1t)f.value=this.value});
  q('f').onsubmit=function(e){e.preventDefault();submit()};
  if(edit)q('cx').onclick=cancelView;
}
function gather(){
  var ev=S.ev,s=S.slot,edit=S.mode==='edit',er=[];
  var get=function(id){return q(id)?q(id).value.trim():''};
  var T=+q('tt').value,A=+q('ad').value,kids=T-A;
  var kk=q('bk_')?+q('bk_').value:0,ks=q('bs_')?+q('bs_').value:0,km=q('bm_')?+q('bm_').value:0;
  if(kids&&kk+ks+km!==kids)er.push('お子様の内訳の合計を、お子様の人数（'+kids+'名）に合わせてください');
  var d={owner:get('oc'),name:get('rn'),corp:get('rc'),tel:get('rt'),mail:edit?S.rec.mail:get('rm'),a:A,k:kk,s:ks,m:km,note:get('nt'),participants:[],car:{},order:!!(q('od')&&q('od').checked),stores:[],staff:{}};
  if(!d.name)er.push('代表申込者を入力してください');
  if(!/^[0-9０-９+\-ー－\s]{9,15}$/.test(d.tel))er.push('連絡先（電話番号）を正しく入力してください');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.mail))er.push('メールアドレスを正しく入力してください');
  if(q('pn'))d.participants=[].map.call(q('pn').querySelectorAll('input'),function(i){return i.value.trim()});
  if(!d.order){
    d.car={pref:get('pf'),cls:get('cl'),kana:get('kn'),num:get('nm'),model:fixModel(get('md'))};
    if(!d.car.pref||!/^\d{1,3}$/.test(d.car.cls)||!/^[ぁ-ん]$/.test(d.car.kana)||!/^\d{1,4}$/.test(d.car.num))er.push('保有レクサス車の登録ナンバーを入力してください');
    if(!d.car.model)er.push('車種を入力してください');
  }
  app.querySelectorAll('.st').forEach(function(c){
    if(!c.checked)return;
    var k=c.dataset.k,v=app.querySelector('select[data-k="'+k+'"]').value;
    d.stores.push(k);if(!v)er.push(k+'の担当スタッフを選択してください');else d.staff[k]=v;
  });
  if(!d.stores.length)er.push('ご利用店舗を選択してください');
  return {d:d,er:er};
}
async function submit(){
  var g=gather(),er=q('er'),btn=q('go');
  if(g.er.length){er.textContent=g.er.join('\n');return}
  er.textContent='';busy(true,btn,'送信中…');
  try{
    var r;
    if(S.mode==='edit'){
      var ns=q('ns')?q('ns').value:S.slot.id;
      if(ns!==S.slot.id){
        var tg=S.slots.filter(function(x){return x.id===ns})[0],nn=g.d.a+g.d.k+g.d.s+g.d.m;
        var fullT=tg&&((tg.capG&&(tg.booked||0)>=tg.capG)||(tg.capP&&(tg.people||0)+nn>tg.capP));
        if(fullT&&S.rec.status==='confirmed'){
          if(S.ev.wait===false||S.ev.method==='抽選'){alert('恐れ入ります。ご希望の時間帯は満席のため、変更をお受けできません。現在のご予約はそのままです。');return}
          if(!confirm('ご希望の時間帯は、現在満席です。\n\n変更をお進めいただくと「キャンセル待ち」となり、元のお時間のご予約は解放されます。空きが出なかった場合、ご参加いただけないこともございます。\n\nこのまま変更しますか？'))return;
        }
      }
      var patch=Object.assign({},g.d);delete patch.mail;
      r=await C.change(S.rec.id,S.rec.mail,patch,ns);
      if(r.ok){var l=await C.lookup(S.rec.id,S.rec.mail);S.rec=Object.assign({id:S.rec.id},l.r);S.msg=r.waitlisted?'ご希望の時間帯は満席のため、キャンセル待ち（'+r.waitNo+'番目）として受け付けました。元のお時間のご予約は解放されています。空きが出た場合は、店舗からご連絡します。':'変更を保存しました';return detailView()}
    }else{
      r=await C.book(S.slot.id,g.d);
      if(r.ok){myAdd(r.id,g.d.mail);return doneView(r,g.d)}
    }
    er.textContent=r.msg||'処理できませんでした';
  }catch(e){er.textContent=e.code==='permission-denied'?'お申し込みを受け付けられませんでした。受付開始前、または受付が終了している可能性があります。画面を更新して、もう一度お試しください。':'通信に失敗しました。電波の良い場所で、もう一度お試しください。（'+(e.code||e.message||'')+'）'}
  busy(false,btn,S.mode==='edit'?'変更を保存する':S.ev.method==='抽選'?'抽選に申し込む':'予約する');
}

/* ---------- 完了 ---------- */
function doneView(r,d){
  top();
  var s=S.slot,ev=S.ev;
  var msg=r.status==='confirmed'?'ご予約が完了しました。':r.status==='wait'?'キャンセル待ちとして受け付けました（'+r.waitNo+'番目）。空きが出た場合は、店舗からご連絡します。':'抽選のお申し込みを受け付けました。';
  app.innerHTML='<h2>'+msg+'</h2><div class="card"><b>'+esc(ev.name)+'</b><br>'+day(s.date)+' '+rng(s)+'<br>'+esc(d.name)+' 様　'+(d.a+d.k+d.s+d.m)+'名</div>'+
   '<p class="note" style="margin:14px 0 0">予約番号（変更・キャンセル'+(ev.method==='抽選'?'・抽選結果の確認':'')+'に必要です）</p><div class="code">'+fmtCode(r.id)+'</div>'+
   '<div class="box">この予約番号は、この端末のトップ画面「あなたの予約」にも表示されます。別の端末で確認する場合に備えて、スクリーンショットを保存するか、予約番号をメモしてください。予約確認のメールは送信されません。</div>'+
   keepHTML()+'<button class="p" id="hm" style="margin-top:14px">トップへ戻る</button>';
  q('hm').onclick=home;
  wireKeep({id:r.id,mail:C.normMail(d.mail),eventName:ev.name,date:s.date,start:s.start,end:s.end});
}

/* ---------- 予約の確認・変更・キャンセル ---------- */
function lookupView(){
  top();
  app.innerHTML='<button class="l" id="bk">← 戻る</button><h2>ご予約の確認・変更・キャンセル</h2><form id="f"><label>予約番号<input id="lc" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX-XXXX" required></label>'+
   '<label>メールアドレス（お申し込み時のもの）<input id="lm" type="email" autocomplete="email" required></label><div class="err" id="er"></div><button class="p" id="go" type="submit">確認する</button></form>'+
   '<div style="margin-top:22px;text-align:center"><button class="l" id="fo">予約番号がわからない方は、オーナーズカードIDで探す</button></div>';
  q('fo').onclick=ownerFindView;
  q('bk').onclick=home;
  q('f').onsubmit=async function(e){
    e.preventDefault();busy(true,q('go'),'確認中…');
    try{
      var r=await C.lookup(q('lc').value,q('lm').value);
      if(!r.ok){q('er').textContent=r.msg;busy(false,q('go'),'確認する');return}
      S.rec=Object.assign({id:r.id},r.r);myAdd(r.id,S.rec.mail);S.msg='';await loadForRec();detailView();
    }catch(x){q('er').textContent='通信に失敗しました。もう一度お試しください。（'+(x.code||x.message||'')+'）';busy(false,q('go'),'確認する')}
  };
}
function ownerFindView(){
  top();
  app.innerHTML='<button class="l" id="bk">← 戻る</button><h2>オーナーズカードIDで探す<small>お申し込みのときに、オーナーズカードIDを入力された方が、探せます</small></h2><form id="f"><label>オーナーズカードID<input id="fo_id" maxlength="30" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="latin" required></label>'+
   '<label>メールアドレス（お申し込み時のもの）<input id="fo_m" type="email" autocomplete="email" required></label><div class="err" id="er"></div><button class="p" id="go" type="submit">探す</button></form><div id="fl"></div>';
  q('bk').onclick=lookupView;
  q('f').onsubmit=async function(e){
    e.preventDefault();busy(true,q('go'),'探しています…');q('fl').innerHTML='';
    try{
      var r=await C.findByOwner(q('fo_id').value,q('fo_m').value);
      busy(false,q('go'),'探す');
      if(!r.ok){q('er').textContent=r.msg;return}
      q('er').textContent='';
      q('fl').innerHTML='<h2 style="font-size:16px">見つかったご予約</h2>'+r.list.map(function(x,i){var v=x.r;
        return '<div class="card"><div>'+stBadge(v)+'</div><p style="margin:8px 0 0"><b>'+esc(v.eventName)+'</b><br>'+day(v.date)+' '+rng(v)+'<br>'+esc(v.name)+' 様　'+v.n+'名<br><span class="note">予約番号 '+fmtCode(x.id)+'</span></p><button class="s" data-o="'+i+'">開く（変更・キャンセル）</button></div>'}).join('');
      q('fl').querySelectorAll('[data-o]').forEach(function(b){b.onclick=async function(){
        var x=r.list[+b.dataset.o];S.rec=Object.assign({id:x.id},x.r);myAdd(x.id,S.rec.mail);S.msg='';b.disabled=true;
        try{await loadForRec();detailView()}catch(er){b.disabled=false;alert('通信に失敗しました。もう一度お試しください。')}}});
    }catch(x){busy(false,q('go'),'探す');q('er').textContent='通信に失敗しました。もう一度お試しください。（'+(x.code||x.message||'')+'）'}
  };
}
async function loadForRec(){
  var r=S.rec,es=await C.events.doc(r.eventId).get();
  S.ev=Object.assign({id:r.eventId},es.exists?es.data():{name:r.eventName});
  var sn=await C.slots.where('eventId','==',r.eventId).get();
  S.slots=sn.docs.map(function(d){return Object.assign({id:d.id},d.data())}).sort(function(a,b){return (a.date+a.start)<(b.date+b.start)?-1:1});
  S.slot=S.slots.filter(function(x){return x.id===r.slotId})[0]||{id:r.slotId,date:r.date,start:r.start,end:r.end,maxPer:4,capG:0};
}
function detailView(){
  top();
  var r=S.rec,can=r.status!=='cancel'&&r.status!=='lost';
  var h='<button class="l" id="bk">← トップへ</button><h2>ご予約内容</h2>'+(S.msg?'<div class="box">'+esc(S.msg)+'</div>':'')+
   '<div class="card"><div>'+stBadge(r)+'</div><p style="margin:8px 0 0"><b>'+esc(r.eventName)+'</b><br>'+day(r.date)+' '+rng(r)+'<br>'+esc(r.name)+' 様　'+r.n+'名<br><span class="note">予約番号 '+fmtCode(r.id)+'</span></p></div>';
  if(r.status==='wait')h+='<div class="box">キャンセル待ちです。空きが出た場合は、店舗からご連絡します。</div>';
  if(r.status==='lottery')h+='<div class="box">抽選結果は、締切後にこの画面で確認できます。</div>';
  if(r.status==='lost')h+='<div class="box">今回は抽選の結果、ご案内できませんでした。</div>';
  if(can)h+=keepHTML();
  if(can)h+='<button class="p" id="ed" style="margin-top:14px">内容を変更する</button><div style="text-align:center;margin-top:16px"><button class="s d" id="cx">この予約をキャンセルする</button></div>';
  app.innerHTML=h;
  q('bk').onclick=home;
  if(can)wireKeep(r);
  if(can){q('ed').onclick=function(){
      if(S.rec.status==='confirmed'||S.rec.status==='won'){
        if(!confirm('ご予約内容の変更について\n\n時間帯を変更される場合、変更先に空きがあれば、そのままお手続きいただけます。\n\n変更先が満席の場合は、順番の並び直しとなり、「キャンセル待ち」となる、またはご変更をお受けできない場合がございます。（キャンセル待ちとなった場合、元のお時間のご予約は解放されます。）\n\n内容を変更しますか？'))return;
      }
      S.mode='edit';formView()};q('cx').onclick=cancelView}
}
function cancelView(){
  var r=S.rec;
  if(!confirm('この予約をキャンセルします。よろしいですか？'))return;
  C.cancel(r.id,r.mail).then(function(x){
    if(!x.ok){alert(x.msg);return}
    S.rec.status='cancel';S.msg='キャンセルしました';detailView();
  }).catch(function(){alert('通信に失敗しました。もう一度お試しください。')});
}

/* ---------- メールの控えのリンクから開く（#r=予約番号&m=メール） ---------- */
async function openFromLink(){
  var m=/^#r=([A-Za-z0-9]{12})&m=(.+)$/.exec(location.hash||'');
  if(!m)return home();
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  try{
    var r=await C.lookup(m[1],decodeURIComponent(m[2]));
    if(r.ok){S.rec=Object.assign({id:r.id},r.r);myAdd(r.id,S.rec.mail);S.msg='';await loadForRec();return detailView()}
  }catch(e){}
  home();
}

/* ---------- 起動 ---------- */
var RV=window.RV;
if(typeof firebase==='undefined'||!window.FIREBASE_CONFIG||/ここに/.test(FIREBASE_CONFIG.apiKey)){
  app.innerHTML='<div class="card err">Firebaseの設定が未入力です（firebase-config.js）。</div>';
}else{
  firebase.initializeApp(FIREBASE_CONFIG);
  C=makeCore(firebase,firebase.firestore());
  syncTime().then(openFromLink);
}
})();
</script>
