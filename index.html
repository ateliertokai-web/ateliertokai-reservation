<link rel="icon" type="image/png" href="icon-192.png">

<body>
<header class="top"><h1>Atelier Tokai reservation</h1></header>
<main id="app"><p class="note" style="text-align:center;padding:40px 0">読み込み中…</p></main>
<script>
(function(){var er=[];window.__er=er;
window.addEventListener('error',function(e){var t=e.target;er.push(t&&t.src?'読込失敗:'+t.src.split('/').pop():(e.message||'error'))},true);
setTimeout(function(){var a=document.getElementById('app');
if(a&&a.children.length===1&&/読み込み中/.test(a.textContent)){
a.innerHTML='<div class="card err">読み込みに時間がかかっています。<br><small>状態: firebase='+(typeof firebase)+' / core='+(typeof makeCore)+(er.length?' / '+er.join(', '):'')+'</small><br><button class="s" style="margin-top:10px" onclick="location.reload()">もう一度読み込む</button></div>'}},15000)})();
</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script>window.firebase||document.write('<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"><\/script>')</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>(window.firebase&&firebase.firestore)||document.write('<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"><\/script>')</script>
<script src="firebase-config.js"></script>
<script src="core.js"></script>
<script>
(function(){
'use strict';
var PV=/[?&#]pv=1(&|$)/.test(location.search+location.hash);
if(PV){var pvb=document.createElement('div');pvb.id='pvbar';pvb.style.cssText='position:sticky;top:0;z-index:50;background:#c0392b;color:#fff;text-align:center;padding:12px 10px;line-height:1.4';pvb.innerHTML='<div style="font-size:22px;font-weight:700;letter-spacing:.05em">確認画面中です</div><div style="font-size:13px;margin-top:2px">練習用の画面です。お客様には見えません。予約は保存されません。</div>';var pm=document.getElementById('app');pm.parentNode.insertBefore(pvb,pm)}
var app=document.getElementById('app'),C,S={ev:null,slots:[],slot:null,mode:'new',rec:null};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var q=function(id){return document.getElementById(id)};
var WD='日月火水木金土';
function day(s){var p=s.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);return (+p[1])+'月'+(+p[2])+'日（'+WD[d.getDay()]+'）'}
function rng(s){return s.start==='00:00'&&s.end==='24:00'?'終日':s.start+'〜'+s.end}
function fmtCode(id){return id.replace(/(.{4})(?=.)/g,'$1-')}
function dl(ev){return ev.deadlineMs?new Date(ev.deadlineMs).toLocaleString('ja-JP',{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'}):''}
function opts(a,b,sel){var o='';for(var i=a;i<=b;i++)o+='<option'+(i===sel?' selected':'')+'>'+i+'</option>';return o}
function busy(on,btn,txt){if(btn){btn.disabled=on;if(txt)btn.textContent=txt}}
function top(){window.scrollTo(0,0)}
/* サーバーの時刻に合わせる（お客様のスマホの時計がずれていても、受付開始の判定がずれないように） */
var TOFF=0;
function nowS(){return Date.now()+TOFF}
function tmo(p,ms){return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'))},ms||12000)})])}
function syncTime(){
  return Promise.race([
    fetch(location.pathname,{method:'HEAD',cache:'no-store'}).then(function(r){var d=r.headers.get('Date');if(d){var t=new Date(d).getTime();if(t)TOFF=t-Date.now()}}).catch(function(){}),
    new Promise(function(res){setTimeout(res,2500)})
  ]);
}
function openText(ms){
  var d=new Date(ms),n=new Date(nowS()),p=function(x){return ('0'+x).slice(-2)},t=d.getHours()+':'+p(d.getMinutes());
  var same=d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate();
  return same?'本日 '+t:(d.getMonth()+1)+'月'+d.getDate()+'日（'+WD[d.getDay()]+'） '+t;
}
/* 車種：全角英数を半角にする（大文字・小文字はそのまま） */
function fixModel(v){return v.replace(/[ａ-ｚＡ-Ｚ０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248)})}
/* この端末に予約番号を覚えておく（メールアドレスも一緒に保存。共用端末では「この端末から消す」で削除できます） */
var MYKEY='yoyaku_my_v1';
function myGet(){try{var a=JSON.parse(localStorage.getItem(MYKEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function mySet(a){try{localStorage.setItem(MYKEY,JSON.stringify(a.slice(0,20)))}catch(e){}}
function myAdd(id,mail){var a=myGet().filter(function(x){return x.id!==id});a.unshift({id:id,mail:mail});mySet(a)}
function myDel(id){mySet(myGet().filter(function(x){return x.id!==id}))}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){} // ブラウザに、保存した記録を消さないよう頼む

/* ---------- 予約の控え（コピー・自分宛メール・カレンダー）。ログインなしでも、予約を見失わないための補助 ---------- */
function myLink(rec){return location.origin+location.pathname+'#r='+rec.id+'&m='+encodeURIComponent(rec.mail)}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t);
  return new Promise(function(res,rej){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy')?res():rej()}catch(e){rej(e)}a.remove()});
}
function slotText(rec){return day(rec.date)+' '+rng(rec)}
function keepHTML(){return '<div class="box" style="margin-top:14px"><b style="font-size:14px">ご予約番号を、なくさないために</b><div class="tools" style="margin:8px 0 0"><button type="button" class="s" id="kc">予約番号をコピー</button><button type="button" class="s" id="km">自分宛にメールで控える</button><button type="button" class="s" id="kd">カレンダーに追加</button></div><p class="note" style="margin:8px 0 0">メールの控えには、予約を開くためのリンクが入ります。他の方には、送らないでください。</p></div>'}
function wireKeep(rec){
  var ev=rec.eventName||'ご予約';
  q('kc').onclick=function(){var b=this;copyText(fmtCode(rec.id)).then(function(){b.textContent='コピーしました'}).catch(function(){b.textContent='コピーできませんでした'})};
  q('km').onclick=function(){
    var box=q('mp');if(box){box.remove();return}
    var body=ev+'\n'+slotText(rec)+'\n予約番号：'+fmtCode(rec.id)+'\n\n▼ご予約の確認・変更・キャンセル\n'+myLink(rec)+'\n\n※ このリンクを開くと、ご予約の内容を確認できます。他の方には、送らないでください。';
    var subj='【予約の控え】'+ev,to=rec.mail,E=encodeURIComponent;
    var mobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent),ios=/iPhone|iPad|iPod/i.test(navigator.userAgent);
    var qs=function(k){return k.map(function(p){return p[0]+'='+E(p[1])}).join('&')};
    var web=function(u){window.open(u,'_blank')};
    // アプリを開く方式は、入っていないと何も起きないので、少し待っても画面が残っていたら、ウェブ版を開く
    var tryApp=function(appUrl,webUrl){
      if(!mobile){web(webUrl);return}
      var t=setTimeout(function(){if(document.visibilityState==='visible')web(webUrl)},1500);
      document.addEventListener('visibilitychange',function f(){if(document.hidden){clearTimeout(t);document.removeEventListener('visibilitychange',f)}});
      location.href=appUrl;
    };
    var opts2=[
      ['標準のメールアプリ',function(){location.href='mailto:'+E(to)+'?'+qs([['subject',subj],['body',body]])}],
      ['Gmail',function(){
        var w='https://mail.google.com/mail/?view=cm&fs=1&'+qs([['to',to],['su',subj],['body',body]]);
        if(ios)tryApp('googlegmail:///co?'+qs([['to',to],['subject',subj],['body',body]]),w);else web(w)}],
      ['Outlook',function(){
        var w='https://outlook.live.com/mail/0/deeplink/compose?'+qs([['to',to],['subject',subj],['body',body]]);
        tryApp('ms-outlook://compose?'+qs([['to',to],['subject',subj],['body',body]]),w)}],
      ['Yahoo!メール（本文をコピーして開く）',function(){copyText('宛先：'+to+'\n件名：'+subj+'\n\n'+body).catch(function(){});web('https://mail.yahoo.co.jp/');setTimeout(function(){alert('本文をコピーしました。Yahoo!メールで「新規作成」を開き、貼り付けて、ご自分宛に送ってください。')},300)}],
      ['本文をコピー',function(){var self=this;copyText(subj+'\n\n'+body).then(function(){alert('コピーしました。お使いのメールに貼り付けて、ご自分宛に送ってください。')}).catch(function(){alert('コピーできませんでした。')})}]
    ];
    box=document.createElement('div');box.id='mp';box.className='box';box.style.marginTop='10px';
    box.innerHTML='<b style="font-size:14px">どのメールで控えますか？</b><div class="tools" style="margin:8px 0 0"></div><p class="note" style="margin:8px 0 0">宛先は、お申し込みのメールアドレスです。送信するまで、メールは送られません。</p>';
    opts2.forEach(function(o){var bt=document.createElement('button');bt.type='button';bt.className='s';bt.textContent=o[0];bt.onclick=function(){o[1].call(bt)};box.querySelector('.tools').appendChild(bt)});
    q('km').closest('.box').appendChild(box);
  };
  q('kd').onclick=function(){
    var p2=function(n){return ('0'+n).slice(-2)},ymd=rec.date.replace(/-/g,''),allday=rec.start==='00:00'&&rec.end==='24:00';
    var now=new Date(),stamp=now.getUTCFullYear()+p2(now.getUTCMonth()+1)+p2(now.getUTCDate())+'T'+p2(now.getUTCHours())+p2(now.getUTCMinutes())+p2(now.getUTCSeconds())+'Z';
    var when=allday?'DTSTART;VALUE=DATE:'+ymd+'\r\nDTEND;VALUE=DATE:'+ymd:'DTSTART:'+ymd+'T'+rec.start.replace(':','')+'00\r\nDTEND:'+ymd+'T'+rec.end.replace(':','')+'00';
    var desc='予約番号：'+fmtCode(rec.id)+'\\n確認・変更・キャンセル：'+myLink(rec);
    var ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Atelier Tokai//reservation//JA','BEGIN:VEVENT','UID:'+rec.id+'@atelier-tokai-reservation','DTSTAMP:'+stamp,when,'SUMMARY:'+ev.replace(/[,;]/g,' ')+'（ご予約）','DESCRIPTION:'+desc,'END:VEVENT','END:VCALENDAR'].join('\r\n');
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar;charset=utf-8'}));a.download='reservation.ics';document.body.appendChild(a);a.click();a.remove();
  };
}
function stBadge(r){
  var s=r.status;
  if(s==='confirmed')return '<span class="st ok">予約確定</span>';
  if(s==='won')return '<span class="st ok">当選・予約確定</span>';
  if(s==='lottery')return '<span class="st lot">抽選結果待ち</span>';
  if(s==='wait')return '<span class="st wait">キャンセル待ち '+(r.waitNo||'')+'番目</span>';
  if(s==='lost')return '<span class="st ng">落選</span>';
  return '<span class="st ng">キャンセル済み</span>';
}

/* ---------- イベント一覧 ---------- */
async function home(){
  top();
  app.innerHTML='<p class="note" style="text-align:center;padding:40px 0">読み込み中…</p>';
  try{
    var snap=await tmo(PV?C.events.get():C.events.where('visible','==',true).get());
    var evs=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())}).sort(function(a,b){return a.name<b.name?-1:1});
    var h='<h2>ご予約・お申し込み<small>ご希望のイベントを選んでください</small></h2>';
    if(!evs.length)h+='<div class="card note">現在、受付中のイベントはありません。</div>';
    var soon=0;
    evs.forEach(function(e,i){
      var notYet=e.openAtMs&&nowS()<e.openAtMs;
      if(notYet&&(!soon||e.openAtMs<soon))soon=e.openAtMs;
      var closed=e.method==='抽選'&&(e.drawn||(e.deadlineMs&&nowS()>e.deadlineMs));
      var inner='<b>'+esc(e.name)+'</b>'+(PV&&e.visible===false?'<span class="tag w">非表示（練習用）</span>':'')+
        (e.method==='抽選'?'<span class="tag k">抽選</span><span>'+(closed?'受付は終了しました':'締切 '+dl(e))+'</span>':'<span class="tag">先着順</span>')+
        (notYet?'<div class="note" style="margin-top:6px;color:#8a6d2f"><b>ご予約は '+openText(e.openAtMs)+' からです</b><br><span class="cd" data-t="'+e.openAtMs+'"></span></div>':'');
      h+='<button class="ev" data-i="'+i+'"'+((closed||notYet)?' disabled style="opacity:.55"':'')+'>'+(e.thumb?'<div class="evr"><img class="evimg" src="'+e.thumb+'" alt=""><div>'+inner+'</div></div>':inner)+'</button>';
    });
    var mine=PV?[]:myGet();
    if(mine.length){
      h+='<h2 style="margin-top:28px">あなたの予約<small>この端末に保存されています</small></h2><div id="my"><p class="note">読み込み中…</p></div>';
    }
    h+='<div style="margin-top:28px;text-align:center"><button class="l" id="lk">ご予約の確認・変更・キャンセル</button></div>';
    app.innerHTML=h;
    app.querySelectorAll('.ev').forEach(function(b){b.onclick=function(){S.ev=evs[+b.dataset.i];pickSlot()}});
    q('lk').onclick=lookupView;
    if(mine.length)loadMine(mine);
    // 受付開始の時刻になったら、自動で画面を更新する
    if(soon){
      var tick=function(){
        if(!q('lk')){clearInterval(iv);return}
        var left=soon-nowS();
        if(left<=0){clearInterval(iv);home();return}
        app.querySelectorAll('.cd').forEach(function(s){
          var l=(+s.dataset.t)-nowS();
          if(l<=0){s.textContent='';return}
          if(l<=3600000){var m=Math.floor(l/60000),sec=Math.floor(l%60000/1000);s.textContent='受付開始まで あと '+m+'分'+('0'+sec).slice(-2)+'秒'}else s.textContent='';
        });
      };
      var iv=setInterval(tick,1000);tick();
    }
  }catch(e){app.innerHTML='<div class="card err">読み込めませんでした。電波の良い場所で、もう一度お試しください。<br><button class="s" id="rt" style="margin-top:10px">もう一度読み込む</button></div>';var rt=q('rt');if(rt)rt.onclick=home}
}

async function loadMine(mine){
  var box=q('my'),out='',rows=[];
  for(var i=0;i<mine.length;i++){
    try{var r=await C.lookup(mine[i].id,mine[i].mail);rows.push(r.ok?{id:mine[i].id,rec:r.r}:{id:mine[i].id,gone:true})}
    catch(e){rows.push({id:mine[i].id,err:true})}
  }
  if(!q('my'))return;
  rows.forEach(function(x,i){
    if(x.rec){var r=x.rec;
      out+='<div class="card"><div>'+stBadge(r)+'</div><p style="margin:8px 0 0"><b>'+esc(r.eventName)+'</b><br>'+day(r.date)+' '+rng(r)+'<br>'+esc(r.name)+' 様　'+r.n+'名<br><span class="note">予約番号 '+fmtCode(x.id)+'</span></p>'+
       '<button class="s" data-o="'+i+'">開く（変更・キャンセル）</button> <button class="s" data-d="'+i+'">この端末から消す</button></div>';
    }else{
      out+='<div class="card"><p class="note" style="margin:0">予約番号 '+fmtCode(x.id)+(x.gone?'<br>予約が見つかりませんでした。':'<br>読み込めませんでした。')+'</p><button class="s" data-d="'+i+'">この端末から消す</button></div>';
    }
  });
  box.innerHTML=out;
  box.querySelectorAll('[data-o]').forEach(function(b){b.onclick=async function(){
    var x=rows[+b.dataset.o];S.rec=Object.assign({id:x.id},x.rec);S.msg='';b.disabled=true;
    try{await loadForRec();detailView()}catch(e){b.disabled=false;alert('通信に失敗しました。もう一度お試しください。')}}});
  box.querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){
    if(!confirm('この端末の表示から消します（予約自体はキャンセルされません）。よろしいですか？'))return;
    myDel(rows[+b.dataset.d].id);home()}});
}

/* ---------- 日時の選択 ---------- */
async function pickSlot(){
  if(S.ev&&S.ev.openAtMs&&nowS()<S.ev.openAtMs){home();return}
  top();
  app.innerHTML='<p class="note" style="text-align:center;padding:40px 0">読み込み中…</p>';
  try{
    var snap=await tmo(C.slots.where('eventId','==',S.ev.id).get());
    S.slots=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())}).sort(function(a,b){return (a.date+a.start)<(b.date+b.start)?-1:1});
  }catch(e){app.innerHTML='<div class="card err">読み込めませんでした。電波の良い場所で、もう一度お試しください。<br><button class="s" id="rt" style="margin-top:10px">もう一度読み込む</button></div>';var rt=q('rt');if(rt)rt.onclick=pickSlot;return}
  var ev=S.ev,h='<button class="l" id="bk">← イベント一覧へ</button><h2>'+esc(ev.name)+'<small>'+(ev.method==='抽選'?'抽選のお申し込みです（締切 '+dl(ev)+'）':'先着順のお申し込みです')+'</small></h2>';
  if(ev.msg)h+='<div class="box">'+esc(ev.msg).replace(/\n/g,'<br>')+'</div>';
  if(ev.imgN>0){h+=(ev.thumb?'<img class="gthumb" id="gt" src="'+ev.thumb+'" alt="">':'')+'<div id="gal"><button class="s" id="gb">写真・パンフレットを見る（'+ev.imgN+'枚）</button></div>'}
  var cur='';
  if(!S.slots.length)h+='<div class="card note">現在、選べる日時がありません。</div>';
  S.slots.forEach(function(s,i){
    if(s.date!==cur){cur=s.date;h+='<h2 style="font-size:16px">'+day(s.date)+'</h2>'}
    var full=!ev.method||ev.method==='先着'?((s.capG&&(s.booked||0)>=s.capG)||(s.capP&&(s.people||0)>=s.capP)):false;
    var lab=ev.method==='抽選'?'<em>抽選受付中</em>':full?(ev.wait?'<em class="f">満席・キャンセル待ち</em>':'<em class="f">満席</em>'):(s.capG?'<em>残り '+Math.max(0,s.capG-(s.booked||0))+'組</em>':s.capP?'<em>残り '+Math.max(0,s.capP-(s.people||0))+'名</em>':'<em>受付中</em>');
    h+='<button class="slot" data-i="'+i+'"'+(full&&!ev.wait?' disabled':'')+'><b>'+rng(s)+'</b>'+lab+'</button>';
  });
  app.innerHTML=h;
  q('bk').onclick=home;
  if(q('gb')){
    var openGal=async function(){
      var box=q('gal');box.innerHTML='<p class="note">読み込み中…</p>';
      try{var d=await C.eimgs.doc(ev.id).get(),im=d.exists?d.data().imgs:[];
        box.innerHTML='<div class="gal">'+im.map(function(u){return '<img src="'+u+'" alt="">'}).join('')+'</div><button class="s" id="gc">写真を閉じる</button>';
        q('gc').onclick=function(){box.innerHTML='<button class="s" id="gb">写真・パンフレットを見る（'+ev.imgN+'枚）</button>';q('gb').onclick=openGal};
      }catch(e){box.innerHTML='<p class="err">読み込めませんでした。</p>'}
    };
    q('gb').onclick=openGal;if(q('gt'))q('gt').onclick=openGal;
  }
  app.querySelectorAll('.slot').forEach(function(b){b.onclick=function(){S.slot=S.slots[+b.dataset.i];S.mode='new';S.rec=null;formView()}});
}

/* ---------- 申込フォーム（新規・変更の共通） ---------- */
function formView(){
  top();
  var ev=S.ev,s=S.slot,r=S.rec||{},edit=S.mode==='edit',car=r.car||{},max=s.maxPer;
  var stores=r.stores||[];
  var h=(edit?'<button class="l" id="bk">← 戻る</button>':'<button class="l" id="bk">← 日時を選び直す</button>')+
   '<h2>'+esc(ev.name)+'<small>'+day(s.date)+' '+rng(s)+'</small></h2>';
  if(ev.msg)h+='<div class="box">'+esc(ev.msg).replace(/\n/g,'<br>')+'</div>';
  if(!edit&&ev.method==='抽選')h+='<p class="box">抽選のお申し込みです。'+dl(ev)+'に締め切ります。結果は「ご予約の確認・変更」で、予約番号とメールアドレスを入力してご確認ください。</p>';

function gather(){
  var ev=S.ev,s=S.slot,edit=S.mode==='edit',er=[];
  var get=function(id){return q(id)?q(id).value.trim():''};
  var T=+q('tt').value,A=+q('ad').value,kids=T-A;
  var kk=q('bk_')?+q('bk_').value:0,ks=q('bs_')?+q('bs_').value:0,km=q('bm_')?+q('bm_').value:0;
  if(kids&&kk+ks+km!==kids)er.push('お子様の内訳の合計を、お子様の人数（'+kids+'名）に合わせてください');
  var d={owner:get('oc'),name:get('rn'),corp:get('rc'),tel:get('rt'),mail:edit?S.rec.mail:get('rm'),a:A,k:kk,s:ks,m:km,note:get('nt'),participants:[],car:{},order:!!(q('od')&&q('od').checked),stores:[],staff:{}};
  if(!d.name)er.push('代表申込者を入力してください');
  if(!/^[0-9０-９+\-ー－\s]{9,15}$/.test(d.tel))er.push('連絡先（電話番号）を正しく入力してください');
  if(d.mail?!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.mail):(!S.ev.mailOpt&&S.mode!=='edit'))er.push('メールアドレスを正しく入力してください');
  if(q('pn'))d.participants=[].map.call(q('pn').querySelectorAll('input'),function(i){return i.value.trim()});
  if(!d.order){
    d.car={pref:get('pf'),cls:get('cl'),kana:get('kn'),num:get('nm'),model:fixModel(get('md'))};
    if(!d.car.pref||!/^\d{1,3}$/.test(d.car.cls)||!/^[ぁ-ん]$/.test(d.car.kana)||!/^\d{1,4}$/.test(d.car.num))er.push('保有レクサス車の登録ナンバーを入力してください');
    if(!d.car.model)er.push('車種を入力してください');
  }
  app.querySelectorAll('.st').forEach(function(c){
    if(!c.checked)return;
    var k=c.dataset.k,v=app.querySelector('select[data-k="'+k+'"]').value;
    d.stores.push(k);if(!v)er.push(k+'の担当スタッフを選択してください');else d.staff[k]=v;
  });
  if(!d.stores.length)er.push('ご利用店舗を選択してください');
  return {d:d,er:er};
}
async function submit(){
  var g=gather(),er=q('er'),btn=q('go');
  if(g.er.length){er.textContent=g.er.join('\n');return}
  er.textContent='';busy(true,btn,'送信中…');
  try{
    var r;
    if(S.mode==='edit'){
      var ns=q('ns')?q('ns').value:S.slot.id;
      if(ns!==S.slot.id){
        var tg=S.slots.filter(function(x){return x.id===ns})[0],nn=g.d.a+g.d.k+g.d.s+g.d.m;
        var fullT=tg&&((tg.capG&&(tg.booked||0)>=tg.capG)||(tg.capP&&(tg.people||0)+nn>tg.capP));
        if(fullT&&S.rec.status==='confirmed'){
          if(S.ev.wait===false||S.ev.method==='抽選'){alert('恐れ入ります。ご希望の時間帯は満席のため、変更をお受けできません。現在のご予約はそのままです。');return}
          if(!confirm('ご希望の時間帯は、現在満席です。\n\n変更をお進めいただくと「キャンセル待ち」となり、元のお時間のご予約は解放されます。空きが出なかった場合、ご参加いただけないこともございます。\n\nこのまま変更しますか？'))return;
        }
      }
      var patch=Object.assign({},g.d);delete patch.mail;
      r=await C.change(S.rec.id,S.rec.mail,patch,ns);
      if(r.ok){var l=await C.lookup(S.rec.id,S.rec.mail);S.rec=Object.assign({id:S.rec.id},l.r);S.msg=r.waitlisted?'ご希望の時間帯は満席のため、キャンセル待ち（'+r.waitNo+'番目）として受け付けました。元のお時間のご予約は解放されています。空きが出た場合は、店舗からご連絡します。':'変更を保存しました';return detailView()}
    }else{
      if(PV){r={ok:true,id:'PRACTICE0000',status:'confirmed'};return doneView(r,g.d)}
      r=await C.book(S.slot.id,g.d);
      if(r.ok){myAdd(r.id,g.d.mail);return doneView(r,g.d)}
    }
    er.textContent=r.msg||'処理できませんでした';
  }catch(e){er.textContent=e.code==='permission-denied'?'お申し込みを受け付けられませんでした。受付開始前、または受付が終了している可能性があります。画面を更新して、もう一度お試しください。':'通信に失敗しました。電波の良い場所で、もう一度お試しください。（'+(e.code||e.message||'')+'）'}
  busy(false,btn,S.mode==='edit'?'変更を保存する':S.ev.method==='抽選'?'抽選に申し込む':'予約する');
}

        if(!confirm('ご予約内容の変更について\n\n時間帯を変更される場合、変更先に空きがあれば、そのままお手続きいただけます。\n\n変更先が満席の場合は、順番の並び直しとなり、「キャンセル待ち」となる、またはご変更をお受けできない場合がございます。（キャンセル待ちとなった場合、元のお時間のご予約は解放されます。）\n\n内容を変更しますか？'))return;
      }
      S.mode='edit';formView()};q('cx').onclick=cancelView}
}
function cancelView(){
  var r=S.rec;
  if(!confirm('この予約をキャンセルします。よろしいですか？'))return;
  C.cancel(r.id,r.mail).then(function(x){
    if(!x.ok){alert(x.msg);return}
    S.rec.status='cancel';S.msg='キャンセルしました';detailView();
  }).catch(function(){alert('通信に失敗しました。もう一度お試しください。')});
}

/* ---------- QRコード（外部ライブラリなし。バイトモード・誤り訂正M・型番1〜10） ---------- */
var QR=(function(){
  var ECC=[0,10,16,26,18,24,16,18,22,22,26],BLK=[0,1,1,1,2,2,4,4,4,5,5];
  function raw(v){var r=(16*v+128)*v+64;if(v>=2){var n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36}return r}
  function dataCw(v){return Math.floor(raw(v)/8)-ECC[v]*BLK[v]}
  function mul(x,y){var z=0;for(var i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z&255}
  function div(d){var r=[];for(var i=0;i<d-1;i++)r.push(0);r.push(1);var root=1;for(i=0;i<d;i++){for(var j=0;j<r.length;j++){r[j]=mul(r[j],root);if(j+1<r.length)r[j]^=r[j+1]}root=mul(root,2)}return r}
  function rem(data,dv){var r=dv.map(function(){return 0});data.forEach(function(b){var f=b^r.shift();r.push(0);dv.forEach(function(c,i){r[i]^=mul(c,f)})});return r}
  function utf8(s){var o=[],e=unescape(encodeURIComponent(s));for(var i=0;i<e.length;i++)o.push(e.charCodeAt(i));return o}
  function make(text){
    var bytes=utf8(text),v,cap;
    for(v=1;v<=10;v++){cap=dataCw(v)*8;if(4+(v<10?8:16)+bytes.length*8<=cap)break}
    if(v>10)throw new Error('too long');
    var bits=[],push=function(val,n){for(var i=n-1;i>=0;i--)bits.push((val>>>i)&1)};
    push(4,4);push(bytes.length,v<10?8:16);bytes.forEach(function(b){push(b,8)});
    push(0,Math.min(4,cap-bits.length));while(bits.length%8)bits.push(0);
    for(var p=0xEC;bits.length<cap;p^=0xEC^0x11)push(p,8);
    var data=[];for(var i=0;i<bits.length;i+=8){var b=0;for(var j=0;j<8;j++)b=(b<<1)|bits[i+j];data.push(b)}
    // 誤り訂正とインターリーブ
    var nb=BLK[v],el=ECC[v],rc=Math.floor(raw(v)/8),ns=nb-rc%nb,sl=Math.floor(rc/nb),dv=div(el),blocks=[],k=0;
    for(i=0;i<nb;i++){var d=data.slice(k,k+sl-el+(i<ns?0:1));k+=d.length;var ec=rem(d,dv);if(i<ns)d.push(0);blocks.push(d.concat(ec))}
    var all=[];for(i=0;i<blocks[0].length;i++)for(j=0;j<nb;j++)if(i!==sl-el||j>=ns)all.push(blocks[j][i]);
    var size=v*4+17,M=[],F=[];for(i=0;i<size;i++){M.push([]);F.push([]);for(j=0;j<size;j++){M[i].push(false);F[i].push(false)}}
    var set=function(x,y,dk){M[y][x]=dk;F[y][x]=true};
    for(i=0;i<size;i++){set(6,i,i%2===0);set(i,6,i%2===0)}
    [[3,3],[size-4,3],[3,size-4]].forEach(function(c){for(var dy=-4;dy<=4;dy++)for(var dx=-4;dx<=4;dx++){var x=c[0]+dx,y=c[1]+dy,dd=Math.max(Math.abs(dx),Math.abs(dy));if(x>=0&&x<size&&y>=0&&y<size)set(x,y,dd!==2&&dd!==4)}});
    if(v>1){var na=Math.floor(v/7)+2,step=Math.ceil((v*4+4)/(na*2-2))*2,pos=[6];for(var q=size-7;pos.length<na;q-=step)pos.splice(1,0,q);
      for(i=0;i<na;i++)for(j=0;j<na;j++){if((i===0&&j===0)||(i===0&&j===na-1)||(i===na-1&&j===0))continue;for(var ay=-2;ay<=2;ay++)for(var ax=-2;ax<=2;ax++)set(pos[i]+ax,pos[j]+ay,Math.max(Math.abs(ax),Math.abs(ay))!==1)}}
    var fmt=function(mask){var dd=(0<<3)|mask,r=dd;for(var t=0;t<10;t++)r=(r<<1)^((r>>>9)*0x537);var b=((dd<<10)|r)^0x5412,g=function(n){return ((b>>>n)&1)!==0};
      for(var t2=0;t2<=5;t2++)set(8,t2,g(t2));set(8,7,g(6));set(8,8,g(7));set(7,8,g(8));for(t2=9;t2<15;t2++)set(14-t2,8,g(t2));
      for(t2=0;t2<8;t2++)set(size-1-t2,8,g(t2));for(t2=8;t2<15;t2++)set(8,size-15+t2,g(t2));set(8,size-8,true)};
    fmt(0);
    if(v>=7){var r7=v;for(i=0;i<12;i++)r7=(r7<<1)^((r7>>>11)*0x1F25);var vb=(v<<12)|r7;for(i=0;i<18;i++){var bt=((vb>>>i)&1)!==0,a=size-11+i%3,c2=Math.floor(i/3);set(a,c2,bt);set(c2,a,bt)}}
    var n=0;for(var right=size-1;right>=1;right-=2){if(right===6)right=5;for(var vt=0;vt<size;vt++)for(j=0;j<2;j++){var x=right-j,up=((right+1)&2)===0,y=up?size-1-vt:vt;if(!F[y][x]&&n<all.length*8){M[y][x]=((all[n>>>3]>>>(7-(n&7)))&1)!==0;n++}}}
    var cond=function(m,x,y){switch(m){case 0:return (x+y)%2===0;case 1:return y%2===0;case 2:return x%3===0;case 3:return (x+y)%3===0;case 4:return (Math.floor(x/3)+Math.floor(y/2))%2===0;case 5:return x*y%2+x*y%3===0;case 6:return (x*y%2+x*y%3)%2===0;default:return ((x+y)%2+x*y%3)%2===0}};
    var apply=function(m){for(var y=0;y<size;y++)for(var x=0;x<size;x++)if(!F[y][x]&&cond(m,x,y))M[y][x]=!M[y][x]};
    var pen=function(){var s=0,dark=0,x,y,run,c;
      for(y=0;y<size;y++){run=1;for(x=1;x<size;x++){if(M[y][x]===M[y][x-1]){run++;if(run===5)s+=3;else if(run>5)s++}else run=1}}
      for(x=0;x<size;x++){run=1;for(y=1;y<size;y++){if(M[y][x]===M[y-1][x]){run++;if(run===5)s+=3;else if(run>5)s++}else run=1}}
      for(y=0;y<size-1;y++)for(x=0;x<size-1;x++){c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])s+=3}
      for(y=0;y<size;y++)for(x=0;x<size;x++)if(M[y][x])dark++;
      s+=Math.floor(Math.abs(dark*20-size*size*10)/(size*size))*10;return s};
    var best=0,bp=1e9;for(var m=0;m<8;m++){apply(m);fmt(m);var pp=pen();if(pp<bp){bp=pp;best=m}apply(m)}
    apply(best);fmt(best);
    return M;
  }
  // 画像（PNGのdata URL）にする。長押しで保存できるように <img> で表示する
  function dataURL(text,scale){
    var M=make(text),s=scale||6,q=4,n=M.length,cv=document.createElement('canvas'),cx;
    cv.width=cv.height=(n+q*2)*s;cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.fillStyle='#000';
    for(var y=0;y<n;y++)for(var x=0;x<n;x++)if(M[y][x])cx.fillRect((x+q)*s,(y+q)*s,s,s);
    return cv.toDataURL('image/png');
  }
  return {make:make,dataURL:dataURL};
})();

/* ---------- ゴルフ: お連れ様の入力（代表者の予約画面） ---------- */
function guestShareText(r,url){
  return '【ゴルフ参加者情報のご入力のお願い】\n'+r.name+' 様からのご案内です。\n\n■ '+r.eventName+'\n■ '+day(r.date)+' '+rng(r)+'\n\nお手数ですが、下のURLから、お名前とメールアドレス（スコアボードの送信に使います）をご入力ください。\n'+url+'\n\nレクサス鹿児島東開';
}
function guestUrl(gid){return location.origin+location.pathname+'?g='+gid}
function guestSharePane(pane,gid){
  var url=guestUrl(gid),txt=guestShareText(S.rec,url),E=encodeURIComponent,img='';
  try{img='<img src="'+QR.dataURL(url,6)+'" alt="QRコード" style="width:180px;height:180px;image-rendering:pixelated;display:block;margin:8px auto 4px;border:1px solid #ddd">'}catch(e){}
  pane.innerHTML='<div class="tools" style="margin:10px 0 4px;flex-wrap:wrap"><button type="button" class="s" data-sh="line">LINEで送る</button><button type="button" class="s" data-sh="mail">メールで送る</button><button type="button" class="s" data-sh="copy">文章をコピー</button></div>'+
    img+(img?'<p class="note" style="text-align:center;margin:0 0 6px">QRコードは、長押しで保存できます。その場で、お連れ様のスマホで読み取ってもらうこともできます。</p>':'')+
    '<p class="note" style="word-break:break-all;margin:4px 0 0">'+esc(url)+'</p>';
  pane.querySelector('[data-sh="line"]').onclick=function(){location.href='https://line.me/R/share?text='+E(txt)};
  pane.querySelector('[data-sh="mail"]').onclick=function(){location.href='mailto:?subject='+E('【ゴルフ参加者情報のご入力のお願い】'+S.rec.eventName)+'&body='+E(txt)};
  pane.querySelector('[data-sh="copy"]').onclick=function(){var t=this;copyText(txt).then(function(){t.textContent='コピーしました'}).catch(function(){t.textContent='コピーできませんでした'})};
}
async function loadGuests(){
  var box=q('gst');if(!box)return;
  var r=S.rec,inv=r.inv||{},rows=[],sync=false,ps=(r.participants||[]).slice(),notes=[];
  for(var no=2;no<=r.n;no++){
    var g=null;
    if(inv[no]){try{g=await C.getGuest(inv[no])}catch(e){}}
    rows.push({no:no,g:g});
    if(!g)continue;
    var cur=ps[no-1]||'',want=null;
    if(!g.cx&&g.name&&cur!==g.name)want=g.name;
    else if(g.cx&&g.cxName&&cur===g.cxName)want='';
    if(want!==null){while(ps.length<no)ps.push('');ps[no-1]=want;sync=true}
    if(g.cx&&g.cxBy==='guest')notes.push('参加者'+no+'の'+(g.cxName?esc(g.cxName)+' 様':'お連れ様')+'が、入力を取り消しました。');
  }
  // お連れ様が入力したお名前を、予約の参加者名にも反映する
  if(sync){try{await C.res.doc(r.id).update({participants:ps,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});S.rec.participants=ps}catch(e){}}
  var h=notes.length?'<div class="box" style="border-color:#c0392b"><b>お知らせ</b><br>'+notes.join('<br>')+'<br><small>人数を減らす場合は、下の「内容を変更する」から変更してください。</small></div>':'';
  h+=rows.map(function(x){
    var g=x.g,st,btn='';
    if(!g){st='<span class="note">未入力</span>';btn='<button type="button" class="s" data-ga="send" data-no="'+x.no+'">URLを送る</button>'}
    else{
      if(g.cx)st='<span class="note">取り消し（'+(g.cxName?esc(g.cxName)+' 様・':'')+'ご本人が取り消しました）</span>';
      else if(g.name)st='<b>'+esc(g.name)+'</b> 様 <span class="tag k">入力済み</span>';
      else st='<span class="note">未入力（URL送付済み）</span>';
      btn='<button type="button" class="s" data-ga="send" data-no="'+x.no+'">URL・QRを表示</button>'+
        (g.name&&!g.cx?'<button type="button" class="s" data-ga="ren" data-no="'+x.no+'">名前を直す</button>':'')+
        '<button type="button" class="s d" data-ga="del" data-no="'+x.no+'">取り消す</button>';
    }
    return '<div class="card" style="margin:8px 0;padding:10px 12px"><div>参加者'+x.no+'：'+st+'</div><div class="tools" style="margin:8px 0 0;flex-wrap:wrap">'+btn+'</div><div data-gp="'+x.no+'"></div></div>';
  }).join('');
  box.innerHTML=h;
  var byNo={};rows.forEach(function(x){byNo[x.no]=x.g});
  box.querySelectorAll('[data-ga]').forEach(function(b){b.onclick=async function(){
    var no=+b.dataset.no,a=b.dataset.ga,g=byNo[no],pane=box.querySelector('[data-gp="'+no+'"]');
    if(PV){pane.innerHTML='<p class="note">確認画面のため、この操作はできません。</p>';return}
    b.disabled=true;
    try{
      if(a==='send'){
        var gid=await C.makeInvite(S.rec,no);S.rec.inv=Object.assign({},S.rec.inv||{});S.rec.inv[no]=gid;
        guestSharePane(pane,gid);if(!g)b.textContent='URL・QRを表示';
      }else if(a==='ren'){
        var nm=prompt('参加者'+no+'のお名前',g.name||'');
        if(nm&&nm.trim()){await C.renameGuest(g,nm);await loadGuests();return}
      }else if(a==='del'){
        if(!confirm('参加者'+no+(g.name||g.cxName?'（'+(g.name||g.cxName)+' 様）':'')+'の入力を取り消します。送ったURLは使えなくなります。よろしいですか？')){b.disabled=false;return}
        var ps2=await C.cancelGuest(g,'owner',S.rec);
        var inv2=Object.assign({},S.rec.inv||{});delete inv2[no];S.rec.inv=inv2;if(ps2)S.rec.participants=ps2;
        await loadGuests();return;
      }
    }catch(e){pane.innerHTML='<p class="err">うまくいきませんでした。もう一度お試しください。</p>'}
    b.disabled=false;
  }});
}

/* ---------- ゴルフ: お連れ様の入力画面（?g=ID で開く） ---------- */
async function guestView(gid,done){
  top();
  app.innerHTML='<p class="note" style="text-align:center;padding:40px 0">読み込み中…</p>';
  var g=null;
  try{g=await tmo(C.getGuest(gid))}catch(e){app.innerHTML='<div class="card err">読み込めませんでした。電波の良い場所で、もう一度お試しください。<br><button class="s" id="rt" style="margin-top:10px">もう一度読み込む</button></div>';q('rt').onclick=function(){guestView(gid)};return}
  if(!g){app.innerHTML='<div class="card err">このURLは無効です。代表者の方に、もう一度URLを送ってもらってください。</div>';return}
  var info='<div class="card"><b>'+esc(g.ev)+'</b><br>'+(g.date?day(g.date)+' '+rng(g):'')+'<br>代表者：'+esc(g.host)+' 様</div>';
  if(g.cx&&g.cxBy==='owner'){app.innerHTML='<h2>参加者情報のご入力</h2>'+info+'<div class="card err">このURLは、代表者様により取り消されました。ご不明な点は、代表者様にご確認ください。</div>';return}
  if(done==='saved'){
    app.innerHTML='<h2>ご入力ありがとうございました</h2>'+info+'<div class="box">参加者'+g.no+'：<b>'+esc(g.name)+'</b> 様 で保存しました。内容は、代表者様のご予約に反映されます。</div><button class="s" id="re" style="margin-top:14px">入力内容を直す</button>';
    q('re').onclick=function(){guestView(gid)};return;
  }
  if(done==='canceled'){
    app.innerHTML='<h2>入力を取り消しました</h2>'+info+'<div class="box">参加者'+g.no+'のご入力を取り消しました。代表者様に、お知らせします。</div><p class="note">もう一度参加される場合は、このURLから入力し直せます。</p><button class="s" id="re" style="margin-top:8px">もう一度入力する</button>';
    q('re').onclick=function(){guestView(gid)};return;
  }
  app.innerHTML='<h2>参加者情報のご入力<small>参加者'+g.no+'様</small></h2>'+info+
   (g.cx?'<div class="box">ご入力は、取り消されています。もう一度参加される場合は、入力してください。</div>':'')+
   '<form id="gf"><label>お名前<input id="gn" required maxlength="50" autocomplete="name" value="'+esc(g.name||'')+'"></label>'+
   '<label>メールアドレス（任意・スコアボードの送信に使います）<input id="gm" type="email" autocomplete="email" placeholder="'+(g.hasMail&&!g.cx?'保存済みです。変更するときだけ入力してください':'例：name@example.com')+'"></label>'+
   '<label class="chk" style="margin:10px 0"><input type="checkbox" id="go"'+(g.own&&!g.cx?' checked':'')+'>レクサス鹿児島東開のオーナーです</label>'+
   '<div class="err" id="er"></div><button class="p" id="gs" type="submit">保存する</button></form>'+
   (g.name&&!g.cx?'<div style="text-align:center;margin-top:18px"><button class="s d" id="gc" type="button">入力を取り消す</button></div>':'')+
   '<p class="note" style="margin-top:14px">ご入力いただいたメールアドレスは、店舗だけが確認します。代表者様には、お名前だけが表示されます。</p>';
  q('gf').onsubmit=async function(e){
    e.preventDefault();var nm=q('gn').value.trim(),ml=q('gm').value.trim(),er=q('er');
    if(!nm){er.textContent='お名前を入力してください';return}
    if(ml&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(ml)){er.textContent='メールアドレスを正しく入力してください';return}
    er.textContent='';busy(true,q('gs'),'保存中…');
    try{await C.saveGuest(g,{name:nm,mail:ml,own:q('go').checked});guestView(gid,'saved')}
    catch(x){er.textContent='保存できませんでした。もう一度お試しください。';busy(false,q('gs'),'保存する')}
  };
  if(q('gc'))q('gc').onclick=async function(){
    if(!confirm('ご自分の入力（お名前・メールアドレスなど）を取り消します。代表者様にお知らせが届きます。よろしいですか？'))return;
    this.disabled=true;
    try{await C.cancelGuest(g,'guest');guestView(gid,'canceled')}catch(x){this.disabled=false;q('er').textContent='取り消せませんでした。もう一度お試しください。'}
  };
}

/* ---------- メールの控えのリンクから開く（#r=予約番号&m=メール） ---------- */
async function openFromLink(){
  var m=/^#r=([A-Za-z0-9]{12})&m=(.*)$/.exec(location.hash||'');
  if(!m)return home();
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  try{
    var r=await C.lookup(m[1],decodeURIComponent(m[2]));
    if(r.ok){S.rec=Object.assign({id:r.id},r.r);myAdd(r.id,S.rec.mail);S.msg='';await loadForRec();return detailView()}
  }catch(e){}
  home();
}

/* ---------- 起動 ---------- */
var RV=window.RV;
if(typeof firebase==='undefined'||typeof makeCore==='undefined'){
  app.innerHTML='<div class="card err">必要なファイルを読み込めませんでした。電波の良い場所で、もう一度お試しください。<br><button class="s" style="margin-top:10px" onclick="location.reload()">もう一度読み込む</button></div>';
}else if(!window.FIREBASE_CONFIG||/ここに/.test(FIREBASE_CONFIG.apiKey)){
  app.innerHTML='<div class="card err">Firebaseの設定が未入力です（firebase-config.js）。</div>';
}else{
  firebase.initializeApp(FIREBASE_CONFIG);
  var FDB=firebase.firestore();try{FDB.settings({experimentalAutoDetectLongPolling:true,merge:true})}catch(e){}
  C=makeCore(firebase,FDB);
  var GM=/[?&]g=([A-HJ-NP-Z2-9]{12})(&|$)/.exec(location.search);
  syncTime().then(function(){return GM?guestView(GM[1]):openFromLink()});
}
})();
